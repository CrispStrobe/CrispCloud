name: CrispCloud binaries

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run
      - run: tar czf crispcloud-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-web
          path: crispcloud-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsqlite3-dev liblz4-dev
      - uses: ./.github/actions/setup-ebook-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar czf crispcloud-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-linux-x64
          path: crispcloud-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ebook-rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Git auth
        run: |
          $token = "${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:$token@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - name: Build Windows
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-windows-x64
          path: crispcloud-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          android: 'true'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - name: Build Android release or debug fallback
        run: |
          flutter build apk --release || flutter build apk --debug
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk crispcloud-android.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk crispcloud-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-android
          path: crispcloud-android.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -1)
          zip -r -y "$GITHUB_WORKSPACE/crispcloud-macos.zip" "$APP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-macos
          path: crispcloud-macos.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - name: Match App Store dependency integration
        run: flutter config --no-enable-swift-package-manager
      - run: flutter build ios --release --no-codesign
      - name: Package
        run: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-ios-nosign.zip "$APP_PATH"
          else
            zip -r -y crispcloud-ios-nosign.zip build/ios/iphoneos/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-ios-nosign
          path: crispcloud-ios-nosign.zip
          if-no-files-found: error
          retention-days: 14
