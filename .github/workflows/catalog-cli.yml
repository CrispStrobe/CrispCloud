name: Native catalogue CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'packages/crisp_catalog/**', 'tool/verify_catalog_sources.py', 'tool/collect_catalog_licenses.py', 'tool/build_cli_bundle.py', '.github/workflows/catalog-cli.yml']
  pull_request:
    paths: ['cli/**', 'packages/crisp_catalog/**', 'tool/verify_catalog_sources.py', 'tool/collect_catalog_licenses.py', 'tool/build_cli_bundle.py', '.github/workflows/catalog-cli.yml']
  workflow_dispatch:
    inputs:
      spacy_w7_signing_preflight:
        description: 'Only verify existing W7 Developer ID signing access; no CLI build or publication'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: catalog-cli-${{ github.ref }}-${{ inputs.release_tag || 'checks' }}
  cancel-in-progress: true
jobs:
  native:
    if: ${{ !inputs.spacy_w7_signing_preflight }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify reviewed source boundary
        run: python3 tool/verify_catalog_sources.py
      - name: Check Rust contracts
        run: |
          cargo test --locked --manifest-path packages/crisp_catalog/native/Cargo.toml
          cargo test --locked --manifest-path packages/crisp_catalog/native/vendor/crispcat-format/Cargo.toml
      - name: Check Dart boundary and CLI
        run: |
          (cd packages/crisp_catalog && dart pub get && dart analyze)
          (cd cli && dart pub get && dart analyze lib/commands/catalog.dart lib/commands/du.dart lib/disk_usage.dart test/catalog_command_test.dart test/disk_usage_test.dart && dart test)
      - name: Build native CLI bundle
        working-directory: cli
        run: python3 ../tool/build_cli_bundle.py --dart dart
      - name: Bundle format licence notices
        run: |
          cp packages/crisp_catalog/native/vendor/crispcat-format/LICENSE cli/build/cli/bundle/LICENSE-CRISPCAT-MIT.txt
          cp packages/crisp_catalog/README.md cli/build/cli/bundle/CATALOG-README.md
          python3 tool/collect_catalog_licenses.py --output cli/build/cli/bundle/catalog-licenses
      - name: Prepare existing Developer ID signing for published macOS CLI
        if: runner.os == 'macOS' && inputs.release_tag != ''
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_SHA1: ${{ secrets.MACOS_DEVELOPER_ID_SHA1 }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          MACOS_DEVELOPER_ID_FINDEREXT_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_FINDEREXT_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: python3 tool/macos_public_signing.py prepare
      - name: Sign and notarize published macOS CLI
        if: runner.os == 'macOS' && inputs.release_tag != ''
        run: |
          python3 tool/macos_public_signing.py sign-cli --bundle cli/build/cli/bundle \
            --archive "crispcloud-cli-${{ matrix.os }}.zip"
      - name: Remove temporary Developer ID signing material
        if: always() && runner.os == 'macOS' && inputs.release_tag != ''
        run: python3 tool/macos_public_signing.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-cli-${{ matrix.os }}
          path: cli/build/cli/bundle
          if-no-files-found: error
      - name: Package release CLI
        if: inputs.release_tag != '' && runner.os != 'macOS'
        run: python3 -c "import shutil; shutil.make_archive('crispcloud-cli-${{ matrix.os }}', 'zip', 'cli/build/cli/bundle')"
      - name: Publish release CLI
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" "crispcloud-cli-${{ matrix.os }}.zip" --clobber
          if [ "$RUNNER_OS" = macOS ]; then
            gh release upload "$RELEASE_TAG" "crispcloud-cli-${{ matrix.os }}.notarization.json" --clobber
          fi

  spacy-signing-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.spacy_w7_signing_preflight
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify existing identity, profiles and read-only notarization access
        id: signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_SHA1: ${{ secrets.MACOS_DEVELOPER_ID_SHA1 }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          MACOS_DEVELOPER_ID_FINDEREXT_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_FINDEREXT_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: python3 tool/macos_public_signing.py prepare
      - name: Remove temporary signing material
        id: cleanup
        if: always()
        run: python3 tool/macos_public_signing.py cleanup
      - name: Record bounded outcome
        if: always()
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          result = {'schema': 'crispcloud.spacy.w7.signing-preflight.v1',
              'source': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
              'system': platform.platform(), 'architecture': platform.machine(),
              'signing_preflight': os.environ['SIGNING_OUTCOME'],
              'cleanup': os.environ['CLEANUP_OUTCOME'],
              'actual_signed_app_tested': False, 'native_model_run': False,
              'release_or_notary_submission': False, 'provider_default': 'OFF'}
          Path('w7-signing-preflight.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w7-signing-preflight-${{ github.run_id }}
          path: w7-signing-preflight.json
