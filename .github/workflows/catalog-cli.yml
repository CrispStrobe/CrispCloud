name: Native catalogue CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'packages/crisp_catalog/**', 'tool/verify_catalog_sources.py', 'tool/collect_catalog_licenses.py', 'tool/build_cli_bundle.py', '.github/workflows/catalog-cli.yml']
  pull_request:
    paths: ['cli/**', 'packages/crisp_catalog/**', 'tool/verify_catalog_sources.py', 'tool/collect_catalog_licenses.py', 'tool/build_cli_bundle.py', '.github/workflows/catalog-cli.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: catalog-cli-${{ github.ref }}-${{ inputs.release_tag || 'checks' }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify reviewed source boundary
        run: python3 tool/verify_catalog_sources.py
      - name: Check Rust contracts
        run: |
          cargo test --locked --manifest-path packages/crisp_catalog/native/Cargo.toml
          cargo test --locked --manifest-path packages/crisp_catalog/native/vendor/crispcat-format/Cargo.toml
      - name: Check Dart boundary and CLI
        run: |
          (cd packages/crisp_catalog && dart pub get && dart analyze)
          (cd cli && dart pub get && dart analyze lib/commands/catalog.dart lib/commands/du.dart lib/disk_usage.dart test/catalog_command_test.dart test/disk_usage_test.dart && dart test)
      - name: Build native CLI bundle
        working-directory: cli
        run: python3 ../tool/build_cli_bundle.py --dart dart
      - name: Bundle format licence notices
        run: |
          cp packages/crisp_storage/NOTICE-LIBSMB2.txt cli/build/cli/bundle/
          cp packages/crisp_catalog/native/vendor/crispcat-format/LICENSE cli/build/cli/bundle/LICENSE-CRISPCAT-MIT.txt
          cp packages/crisp_catalog/README.md cli/build/cli/bundle/CATALOG-README.md
          python3 tool/collect_catalog_licenses.py --output cli/build/cli/bundle/catalog-licenses
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-cli-${{ matrix.os }}
          path: cli/build/cli/bundle
          if-no-files-found: error
      - name: Package release CLI
        if: inputs.release_tag != ''
        run: python3 -c "import shutil; shutil.make_archive('crispcloud-cli-${{ matrix.os }}', 'zip', 'cli/build/cli/bundle')"
      - name: Publish release CLI
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "crispcloud-cli-${{ matrix.os }}.zip" --clobber
