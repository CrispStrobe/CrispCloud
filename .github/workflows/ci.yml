name: CI

# Runs flutter analyze + tests on every push to main and every PR.
# On PRs, also builds all 6 platforms and uploads artifacts for testing.
#
# IMPORTANT: This project has git dependencies on private repos
# (internxt-dart, filen-dart). To make pub get work, either:
#   1. Make those repos public (simplest), or
#   2. Add a GH_PAT secret (Settings → Secrets → Actions) with a
#      Personal Access Token that has `repo` scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Match .fvmrc and all release jobs; required by the PDF editor.
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crypto-release-inputs:
    name: Crypto release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify release evidence failure paths
        run: python3 -m unittest discover -s tool -p test_crypto_release_evidence.py -v
      - name: Check provider dependencies and Apple declaration
        run: python3 tool/crypto_release_evidence.py --check

  # ---------- Analyze + Test with coverage ----------
  analyze:
    name: Analyze + Test (Linux)
    runs-on: ubuntu-latest
    # The full suite plus plugin contracts can reach 20 minutes before cache
    # cleanup finishes; leave room to report the completed test result.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # Cache Flutter SDK
      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Show Flutter version
        run: flutter --version

      - name: Install trusted distro SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify CI SQLite wrapper restoration
        run: python3 -m unittest discover -s tool -p test_with_ci_system_sqlite.py

      - name: Install dependencies
        run: flutter pub get

      - name: iOS plugin Dart contracts
        run: |
          (cd packages/crisp_ios_files && flutter pub get && flutter analyze && flutter test --coverage)
          (cd packages/crisp_ios_shell && flutter pub get && flutter analyze && flutter test --coverage)
          python3 -m unittest discover -s packages/crisp_ios_shell/tool/tests -v

      - name: Resolve vendored package development dependencies
        run: |
          (cd packages/quds_office_engine && dart pub get)
          (cd packages/quds_office_editor && flutter pub get)
          (cd packages/dart_pdf_editor && flutter pub get)
          (cd packages/dart_pdf_editor_secure_storage && flutter pub get)
          (cd packages/pdf_document && dart pub get)
          (cd packages/pdf_operations && dart pub get)

      - name: Shared storage contracts
        working-directory: packages/crisp_storage
        run: |
          dart pub get
          dart analyze
          dart test

      - name: CLI contracts
        working-directory: cli
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Build CLI bundle with native libraries
        working-directory: cli
        run: |
          dart build cli -o build/cli
          cp ../packages/crisp_storage/NOTICE-LIBSMB2.txt build/cli/bundle/

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: crisp-cli-linux
          path: cli/build/cli/bundle
          if-no-files-found: error

      - name: Prepare isolated SSH fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/storage-fixture"
          "$RUNNER_TEMP/storage-fixture/bin/pip" install --quiet paramiko impacket

      - name: Export dependency inventory
        run: |
          dart pub deps --json > dependency-inventory.json
          flutter pub outdated --no-dev-dependencies > dependency-status.txt || true

      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: |
            dependency-inventory.json
            dependency-status.txt
          retention-days: 30

      - name: flutter analyze (errors fail the build)
        # CLI analysis runs above; analysis_options.yaml excludes it here.
        # Preserve the errors-only policy while also failing on tool crashes.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Fast deterministic tests with coverage
        env:
          CRISPER_SFTP_PYTHON: ${{ runner.temp }}/storage-fixture/bin/python
          CRISPER_SMB_PYTHON: ${{ runner.temp }}/storage-fixture/bin/python
        run: >-
          python3 tool/with_ci_system_sqlite.py flutter test --coverage --concurrency=4
          --exclude-tags=benchmark,live,deploy,mock_server,integration,connection_dialog,golden

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ---------- Native desktop gate (headless, all three OSes) ----------
  # Standing per-PR gate for the file-crypto stack on Linux, Windows and macOS.
  # native_ffi_crypto_test ASSERTS the OS's system-crypto binding loads + is
  # byte-exact + interoperable with existing pointycastle files (Linux->OpenSSL,
  # Windows->BCrypt; a broken FFI fails CI on that OS rather than silently
  # falling back). crypto_paths_test runs the real-file + cross-path interop
  # matrix. Pure-Dart VM tests — no app window, no device. (The native HARDWARE
  # path on macOS/Android/iOS — CryptoKit/Keystore — needs the Flutter engine and
  # stays in nightly's integration test.)
  crypto-gate:
    name: Crypto gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT || github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install trusted distro SQLite (Linux tests only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify CI SQLite wrapper restoration
        run: python3 -m unittest discover -s tool -p test_with_ci_system_sqlite.py

      - run: flutter pub get

      - name: Crypto audit regressions (published vectors and credential migration)
        run: >-
          flutter test --no-pub
          test/aes_siv_test.dart test/cryptomator_test.dart
          test/veracrypt_test.dart test/veracrypt_header_vectors_test.dart
          test/encryption_service_test.dart test/internxt_secure_config_test.dart
          test/internxt_rewire_test.dart test/internxt_download_path_test.dart
          test/internxt_bounded_transfer_test.dart
          test/filen_adapter_test.dart test/filen_bounded_transfer_test.dart
          test/tls_verification_test.dart test/custom_ca_test.dart
          test/infrastructure_test.dart test/proxy_service_test.dart
          test/proxy_settings_i18n_test.dart
          test/backup_service_test.dart test/backup_encryption_security_test.dart

      - name: Office encrypted-package integrity
        working-directory: packages/quds_office_engine
        run: |
          dart pub get
          dart test test/office_crypto_test.dart

      - name: Headless crypto tests (native FFI assertions + cross-path interop)
        run: >-
          flutter test test/native_ffi_crypto_test.dart test/crypto_paths_test.dart
          test/gcm_transfer_stream_test.dart test/encrypted_storage_wrapper_test.dart
          test/native_metadata_test.dart
          test/background_transfer_journal_test.dart
          test/transfer_journal_storage_io_test.dart
          test/integrity_recovery_native_test.dart
          test/file_collection_paging_store_test.dart
          test/native_metadata_windows_test.dart
          test/local_file_service_symlink_test.dart

      # Surface native PTY/ConPTY failures before the full Linux suite finishes.
      # Packaged builds retain their complete terminal regression checks below.
      - name: Native terminal smoke tests
        run: flutter test test/terminal_process_test.dart

  collection-browser:
    name: Browser storage + terminal (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT || github.token }}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - name: IndexedDB concurrency and paged restart recovery
        run: >-
          flutter test --no-pub --reporter expanded --platform chrome --concurrency=1
          test/file_collection_browser_storage_test.dart

      - name: Terminal input and explicit SSH gateway
        run: >-
          flutter test --no-pub --reporter expanded --platform chrome --concurrency=1
          test/terminal_session_test.dart test/terminal_widget_test.dart
          test/ssh_gateway_test.dart test/ssh_terminal_gateway_test.dart
          test/terminal_workspace_web_test.dart

  # ---------- Multi-platform builds (matrix) ----------
  # Linux, Android, and Web build on ubuntu-latest.
  # Windows builds on windows-latest. macOS and iOS on macos-latest.
  build-ubuntu:
    name: Build ${{ matrix.platform }} (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    strategy:
      fail-fast: false
      matrix:
        platform: [web, linux, android]
        include:
          - platform: web
            build_cmd: flutter build web --release
            artifact_name: crispcloud-web
            package_cmd: tar czf crispcloud-web.tar.gz -C build/web .
            artifact_path: crispcloud-web.tar.gz

          - platform: linux
            build_cmd: flutter build linux --release
            artifact_name: crispcloud-linux-x64
            package_cmd: tar czf crispcloud-linux-x64.tar.gz -C build/linux/x64/release/bundle .
            artifact_path: crispcloud-linux-x64.tar.gz

          - platform: android
            build_cmd: ""   # handled inline below
            artifact_name: crispcloud-android
            package_cmd: ""  # handled inline below
            artifact_path: crispcloud-android.apk

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # Java only needed for Android
      - name: Set up Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle (Android only)
        if: matrix.platform == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Linux desktop dependencies
      - name: Install Linux desktop deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev

      - name: Enable Linux desktop
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # --- Web / Linux builds ---
      - name: Build ${{ matrix.platform }}
        if: matrix.platform != 'android'
        run: ${{ matrix.build_cmd }}

      - name: Package ${{ matrix.platform }}
        if: matrix.platform != 'android'
        run: ${{ matrix.package_cmd }}

      # --- Android build (more complex) ---
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release || true
          find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null

      - name: Find and rename APK
        if: matrix.platform == 'android'
        run: |
          APK=$(find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No app-release.apk found — build genuinely failed"
            exit 1
          fi
          echo "Found APK: $APK ($(stat -c%s "$APK") bytes)"
          cp "$APK" crispcloud-android.apk

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  # ---------- Windows ----------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 35
    needs: analyze

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            C:\hostedtoolcache\windows\flutter
            ~\AppData\Local\Pub\Cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-windows-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-windows-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Terminal regression tests (Windows ConPTY)
        run: >-
          flutter test test/terminal_process_test.dart
          test/terminal_session_test.dart test/terminal_widget_test.dart

      - name: Patch pdfx CMake (fix VERSION 2.8.12 rejected by CMake 3.30+)
        shell: bash
        run: |
          # Search both project symlinks and pub cache
          for base in . "$PUB_CACHE" "$LOCALAPPDATA/Pub/Cache" "$HOME/.pub-cache"; do
            [ -d "$base" ] || continue
            TEMPLATE=$(find "$base" -path "*/pdfx*/DownloadProject.CMakeLists.cmake.in" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.14)/' "$TEMPLATE"
              echo "Patched: $TEMPLATE"
              cat "$TEMPLATE"
              break
            fi
          done

      - name: Build Windows
        run: flutter build windows --release
        env:
          # Suppress MSVC experimental coroutine deprecation in local_auth_windows
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-windows-x64
          path: crispcloud-windows-x64.zip
          retention-days: 14

  # ---------- macOS + iOS (both on macos-latest) ----------
  build-macos:
    name: Build + launch macOS
    runs-on: macos-latest
    timeout-minutes: 50
    needs: analyze

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Check macOS startup smoke test behavior
        run: bash test/macos_startup_smoke_test.sh
      - name: Check native FUSE helper signing
        run: bash test/macos_fuse_bridge_signing_test.sh
      - name: Check native FUSE directory pagination
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -I macos/vendor test/fuse_bridge_readdir_test.c -o /tmp/crispcloud-fuse-readdir-test
          /tmp/crispcloud-fuse-readdir-test
      - name: macOS regression tests
        run: >-
          flutter test --concurrency=2
          test/native_ffi_crypto_test.dart
          test/finder_extension_test.dart
          test/local_file_service_test.dart
          test/xdg_test.dart
          test/terminal_process_test.dart
          test/terminal_session_test.dart
          test/terminal_widget_test.dart
          test/azure_range_read_test.dart
          test/fuse_filesystem_protocol_test.dart
          test/fuse_mount_test.dart
          test/macos_fuse_helper_fixture_test.dart
          test/sftp_operation_localization_test.dart
          test/native_preview_error_localization_test.dart
      - run: flutter build macos --release

      - name: Launch release bundle
        run: tool/macos_startup_smoke.sh build/macos/Build/Products/Release/CrispCloud.app 12

      - name: Package macOS build
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
          if [ -n "$APP_NAME" ]; then
            zip -r -y "$GITHUB_WORKSPACE/crispcloud-macos-release.zip" "$APP_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-macos-release
          path: crispcloud-macos-release.zip
          retention-days: 14

  ios-terminal-native:
    name: iOS folder and embedded shell tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Cache verified embedded shell frameworks
        uses: actions/cache@v5
        with:
          path: |
            packages/crisp_ios_shell/ios/Frameworks
            packages/crisp_ios_shell/ios/Resources/BuildProvenance.json
            packages/crisp_ios_shell/.build/downloads
          key: ios-shell-${{ runner.arch }}-${{ hashFiles('packages/crisp_ios_shell/tool/**', 'packages/crisp_ios_shell/patches/**', 'packages/crisp_ios_shell/ios/Resources/commands.plist') }}
          restore-keys: |
            ios-shell-${{ runner.arch }}-
      - name: Native folder-grant and coordinated-access unit tests
        run: swift test --package-path packages/crisp_ios_files/ios/ScopeCore
      - name: Pinned shell source preparation
        run: python3 packages/crisp_ios_shell/tool/prepare.py
      - name: Real ios_system and Dash simulator tests
        run: bash packages/crisp_ios_shell/tool/test_native.sh

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze

    steps:
      - uses: actions/checkout@v5

      - name: Cache verified embedded shell frameworks
        uses: actions/cache@v5
        with:
          path: |
            packages/crisp_ios_shell/ios/Frameworks
            packages/crisp_ios_shell/ios/Resources/BuildProvenance.json
            packages/crisp_ios_shell/.build/downloads
          key: ios-shell-${{ runner.arch }}-${{ hashFiles('packages/crisp_ios_shell/tool/**', 'packages/crisp_ios_shell/patches/**', 'packages/crisp_ios_shell/ios/Resources/commands.plist') }}
          restore-keys: |
            ios-shell-${{ runner.arch }}-

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Verify embedded shell framework loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          apps = list(Path('build/ios/iphoneos').glob('*.app'))
          if len(apps) != 1:
              raise SystemExit(f'Expected one iOS app, found {len(apps)}')
          subprocess.run(['python3', 'packages/crisp_ios_shell/tool/check_packaging.py', str(apps[0])], check=True)
          PY

      - name: Archive .app for later signing
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-ios-nosign.zip "$APP_PATH"
          else
            echo "::warning::iOS .app not found at expected path, archiving build dir"
            zip -r -y crispcloud-ios-nosign.zip build/ios/iphoneos/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-ios-nosign
          path: crispcloud-ios-nosign.zip
          retention-days: 14
