name: CI

# Runs flutter analyze + non-live tests on every push to main and
# every PR.
#
# IMPORTANT: This project has git dependencies on private repos
# (internxt-dart, filen-dart). To make pub get work, either:
#   1. Make those repos public (simplest), or
#   2. Add a GH_PAT secret (Settings → Secrets → Actions) with a
#      Personal Access Token that has `repo` scope.
#
# For Vercel: add the same token as GIT_AUTH_TOKEN in Vercel
# project settings → Environment Variables.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Configure git to authenticate when cloning private dependencies.
      # Uses GH_PAT secret if available, falls back to GITHUB_TOKEN (which
      # only works for public repos or same-repo refs).
      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: flutter analyze (errors fail the build)
        run: |
          flutter analyze 2>&1 | tee analyze.log || true
          if grep -q "  error • " analyze.log; then
            echo "::error::flutter analyze surfaced errors"
            exit 1
          fi
          echo "No errors found (warnings/info are OK)"

      - name: flutter test (unit tests, live tests auto-skip without creds)
        run: flutter test

  build-web:
    name: Build Web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build web
        run: flutter build web --release

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    needs: analyze
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build macos --debug
        run: flutter build macos --debug
