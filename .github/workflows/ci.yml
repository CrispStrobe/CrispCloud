name: CI

# Runs flutter analyze + tests on every push to main and every PR.
# On PRs, also builds all 6 platforms and uploads artifacts for testing.
#
# IMPORTANT: This project has git dependencies on private repos
# (internxt-dart, filen-dart). To make pub get work, either:
#   1. Make those repos public (simplest), or
#   2. Add a GH_PAT secret (Settings → Secrets → Actions) with a
#      Personal Access Token that has `repo` scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Pinned: Flutter >= 3.44 has a pub regression that writes an invalid
  # .dart_tool/package_graph.json ("dependencies for `dart_pg` missing")
  # for hosted packages reached only through a git dependency
  # (internxt_client -> dart_pg). 3.38.5 writes a valid graph for this
  # exact dep set. Revisit when the upstream pub bug is fixed.
  FLUTTER_VERSION: 3.38.5
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------- Analyze + Test with coverage ----------
  analyze:
    name: Analyze + Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Cache Flutter SDK
      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: flutter analyze (errors fail the build)
        run: |
          # Exclude cli/ — it's a separate Dart package with its own pubspec
          flutter analyze --no-fatal-warnings 2>&1 | grep -v "cli/" | tee analyze.log || true
          if grep -q "  error • " analyze.log; then
            echo "::error::flutter analyze surfaced errors"
            exit 1
          fi
          echo "No errors found (warnings/info are OK)"

      - name: flutter test with coverage
        run: flutter test --coverage --exclude-tags=mock_server,integration,connection_dialog,golden

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ---------- Windows native crypto (BCrypt/CNG FFI) ----------
  # The dev machine + Linux CI can't exercise the Windows CNG binding, so run the
  # crypto tests headlessly on a Windows runner. native_ffi_crypto_test ASSERTS
  # BCryptAesGcm loads + is byte-exact + interoperable with pointycastle files
  # (a broken FFI fails CI here instead of silently falling back). No app window.
  windows-crypto:
    name: Native crypto (Windows BCrypt)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT || github.token }}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Native FFI crypto tests (BCrypt + cross-path interop)
        run: flutter test test/native_ffi_crypto_test.dart test/crypto_paths_test.dart

  # ---------- Multi-platform builds (matrix) ----------
  # Linux, Android, and Web build on ubuntu-latest.
  # Windows builds on windows-latest. macOS and iOS on macos-latest.
  build-ubuntu:
    name: Build ${{ matrix.platform }} (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    strategy:
      fail-fast: false
      matrix:
        platform: [web, linux, android]
        include:
          - platform: web
            build_cmd: flutter build web --release
            artifact_name: crispcloud-web
            package_cmd: tar czf crispcloud-web.tar.gz -C build/web .
            artifact_path: crispcloud-web.tar.gz

          - platform: linux
            build_cmd: flutter build linux --release
            artifact_name: crispcloud-linux-x64
            package_cmd: tar czf crispcloud-linux-x64.tar.gz -C build/linux/x64/release/bundle .
            artifact_path: crispcloud-linux-x64.tar.gz

          - platform: android
            build_cmd: ""   # handled inline below
            artifact_name: crispcloud-android
            package_cmd: ""  # handled inline below
            artifact_path: crispcloud-android.apk

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # Java only needed for Android
      - name: Set up Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle (Android only)
        if: matrix.platform == 'android'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Linux desktop dependencies
      - name: Install Linux desktop deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev

      - name: Enable Linux desktop
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # --- Web / Linux builds ---
      - name: Build ${{ matrix.platform }}
        if: matrix.platform != 'android'
        run: ${{ matrix.build_cmd }}

      - name: Package ${{ matrix.platform }}
        if: matrix.platform != 'android'
        run: ${{ matrix.package_cmd }}

      # --- Android build (more complex) ---
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release || true
          find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null

      - name: Find and rename APK
        if: matrix.platform == 'android'
        run: |
          APK=$(find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No app-release.apk found — build genuinely failed"
            exit 1
          fi
          echo "Found APK: $APK ($(stat -c%s "$APK") bytes)"
          cp "$APK" crispcloud-android.apk

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  # ---------- Windows ----------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 35
    needs: analyze

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            C:\hostedtoolcache\windows\flutter
            ~\AppData\Local\Pub\Cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-windows-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-windows-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure git auth for private deps
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Patch pdfx CMake (fix VERSION 2.8.12 rejected by CMake 3.30+)
        shell: bash
        run: |
          # Search both project symlinks and pub cache
          for base in . "$PUB_CACHE" "$LOCALAPPDATA/Pub/Cache" "$HOME/.pub-cache"; do
            [ -d "$base" ] || continue
            TEMPLATE=$(find "$base" -path "*/pdfx*/DownloadProject.CMakeLists.cmake.in" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.14)/' "$TEMPLATE"
              echo "Patched: $TEMPLATE"
              cat "$TEMPLATE"
              break
            fi
          done

      - name: Build Windows
        run: flutter build windows --release
        env:
          # Suppress MSVC experimental coroutine deprecation in local_auth_windows
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-windows-x64
          path: crispcloud-windows-x64.zip
          retention-days: 14

  # ---------- macOS + iOS (both on macos-latest) ----------
  # continue-on-error: macOS runners are scarce on GH free tier and
  # frequently queue for hours. Don't block CI green status.
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 40
    needs: analyze
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --debug

      - name: Package macOS build
        run: |
          cd build/macos/Build/Products/Debug
          APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
          if [ -n "$APP_NAME" ]; then
            zip -r -y "$GITHUB_WORKSPACE/crispcloud-macos-debug.zip" "$APP_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-macos-debug
          path: crispcloud-macos-debug.zip
          retention-days: 14

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    continue-on-error: true  # macOS runners scarce on free tier
    timeout-minutes: 40
    needs: analyze

    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Archive .app for later signing
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-ios-nosign.zip "$APP_PATH"
          else
            echo "::warning::iOS .app not found at expected path, archiving build dir"
            zip -r -y crispcloud-ios-nosign.zip build/ios/iphoneos/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crispcloud-ios-nosign
          path: crispcloud-ios-nosign.zip
          retention-days: 14
