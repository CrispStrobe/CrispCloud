name: Deploy Web

# Builds Flutter web and deploys to Vercel on every push to main.
# Uses pre-built static deploy (Vercel can't build Flutter).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed commit or release tag to deploy
        required: false
        default: main

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Match the tested Flutter toolchain in .fvmrc and ci.yml.
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy to Vercel
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure git auth for private deps
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get
      - name: Build Flutter web
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          flutter build web --release \
            --dart-define=GIT_HASH=$GIT_HASH \
            --dart-define=APP_VERSION=$APP_VERSION

      - name: Record deployed source
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          version = next(line.split(':', 1)[1].strip() for line in pathlib.Path('pubspec.yaml').read_text().splitlines() if line.startswith('version:'))
          pathlib.Path('build/web/deployment.json').write_text(json.dumps({'commit': sha, 'version': version}) + '\n')
          PYTHON

      - name: Verify build output
        run: |
          test -f build/web/index.html || { echo "ERROR: index.html missing"; exit 1; }
          BUILD_SIZE=$(du -sb build/web | cut -f1)
          echo "Build size: $BUILD_SIZE bytes ($(du -sh build/web | cut -f1))"
          if [ "$BUILD_SIZE" -lt 1000000 ]; then
            echo "ERROR: Build output too small ($BUILD_SIZE bytes) — likely broken"
            exit 1
          fi

      - name: Prepare build output for Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cp vercel.json build/web/vercel.json
          mkdir -p build/web/.vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > build/web/.vercel/project.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd build/web
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify deployment is live
        env:
          DEPLOY_URL: https://crisp-cloud.vercel.app
        run: flutter test test/integration/deploy_verify_test.dart --tags deploy --run-skipped

      - name: Verify exact deployed source
        run: python3 tool/verify_web_deployment.py --url https://crisp-cloud.vercel.app --commit "$(git rev-parse HEAD)"
