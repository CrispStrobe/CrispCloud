name: Ebook Linux embedded host

on:
  push:
    branches: [main, 'feature/ebook-*', 'checkpoint/ebook-*']
    paths:
      - 'packages/crisp_ebook_reader/**'
      - 'linux/**'
      - '.github/workflows/ebook-linux-host.yml'
  pull_request:
    paths:
      - 'packages/crisp_ebook_reader/**'
      - 'linux/**'
      - '.github/workflows/ebook-linux-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebook-linux-host-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  linux-host:
    name: ${{ matrix.distro }} / ${{ matrix.host }}
    runs-on: ${{ matrix.distro }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            host: enhanced-rendering
          - distro: ubuntu-24.04
            host: installed-runtime-unavailable
          - distro: ubuntu-24.04
            host: portable-only
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install the distribution's headers, runtime and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev xvfb xauth dbus-x11 libgl1-mesa-dri \
            fonts-dejavu-core python3-pil python3-xlib gdb bubblewrap
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
      - name: Check native surface allocation bounds
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror \
            packages/crisp_ebook_reader/test/linux/surface_size_test.cc \
            -o "$RUNNER_TEMP/ebook-surface-test"
          "$RUNNER_TEMP/ebook-surface-test"
          clang++ -std=c++17 -Wall -Wextra -Werror \
            packages/crisp_ebook_reader/test/linux/canary_supervisor_test.cc \
            -o "$RUNNER_TEMP/ebook-canary-supervisor-test"
          "$RUNNER_TEMP/ebook-canary-supervisor-test"
      - name: Prepare isolated Linux app
        run: |
          flutter create --platforms=linux --project-name crisp_linux_host_smoke "$RUNNER_TEMP/ebook-linux-host"
          extra=()
          if [[ '${{ matrix.host }}' == 'portable-only' ]]; then extra+=(--portable-only); fi
          python3 packages/crisp_ebook_reader/tool/prepare_linux_host_smoke.py "$RUNNER_TEMP/ebook-linux-host" "${extra[@]}"
          cd "$RUNNER_TEMP/ebook-linux-host"
          flutter pub get
      - name: Analyze host and run package tests
        working-directory: packages/crisp_ebook_reader
        run: |
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Exercise the declared native mode without changing sandbox policy
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
          CRISP_EBOOK_HOST_TRACE: '1'
          CRISP_EBOOK_HOST_TRACE_PATH: ${{ runner.temp }}/ebook-linux-host/native-milestones.log
        run: |
          cd "$RUNNER_TEMP/ebook-linux-host"
          mkdir -p build/native-cores
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/ebook-linux-host/build/native-cores/core-%e-%p"
          ulimit -c 1048576
          # Report whether the actual runner permits bubblewrap namespaces.
          # This diagnostic neither changes host policy nor skips the reader.
          bwrap --version
          if bwrap --die-with-parent --unshare-all --ro-bind / / \
              --proc /proc --dev /dev /usr/bin/true; then
            echo 'native sandbox probe: available'
          else
            echo 'native sandbox probe: unavailable'
          fi
          extra=()
          if [[ '${{ matrix.host }}' == 'portable-only' ]]; then extra+=(--dart-define=EXPECT_PORTABLE=true); fi
          if [[ '${{ matrix.host }}' == 'installed-runtime-unavailable' ]]; then extra+=(--dart-define=EXPECT_RUNTIME_UNAVAILABLE=true); fi
          # The 22.04 job must render. The 24.04 job proves recovery from the
          # observed sandbox prerequisite failure, and cannot count as rendering.
          python3 "$GITHUB_WORKSPACE/packages/crisp_ebook_reader/tool/check_linux_host_processes.py" \
            before native-process-baseline.json
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- \
            flutter test integration_test/reader_host_test.dart -d linux \
              --reporter expanded "${extra[@]}" 2>&1 | tee linux-host-test.log
      - name: Verify native child cleanup
        if: always()
        run: |
          baseline="$RUNNER_TEMP/ebook-linux-host/native-process-baseline.json"
          if [[ -f "$baseline" ]]; then
            python3 packages/crisp_ebook_reader/tool/check_linux_host_processes.py after "$baseline"
          fi
      - name: Extract native stacks and discard process memory
        if: always()
        run: |
          cd "$RUNNER_TEMP/ebook-linux-host"
          # Raw dumps can contain inherited credentials. Never upload them or
          # inspect locals/environment; preserve only function-level backtraces.
          for core in build/native-cores/core-*; do
            [[ -f "$core" ]] || continue
            case "$(basename "$core")" in
              core-crisp_linux*)
                timeout 30s gdb --batch --quiet --nx -iex 'set auto-load off' \
                  -ex 'set pagination off' -ex 'set print frame-arguments none' \
                  -ex 'set print entry-values no' -ex 'bt' -ex 'thread apply all bt' \
                  build/linux/x64/debug/bundle/crisp_linux_host_smoke "$core" \
                  >> native-backtrace.log 2>&1 || true
                ;;
            esac
            rm -f -- "$core"
          done
          if [[ -f native-milestones.log ]]; then tail -n 200 native-milestones.log; fi
          if [[ -f native-backtrace.log ]]; then head -n 400 native-backtrace.log; fi
      - name: Verify the app has no hard browser-library dependency
        run: |
          library=$(find "$RUNNER_TEMP/ebook-linux-host/build/linux" -name libcrisp_ebook_reader_plugin.so -print -quit)
          test -n "$library"
          readelf -d "$library" | tee "$RUNNER_TEMP/ebook-linux-host/native-dependencies.log"
          if readelf -d "$library" | grep 'NEEDED' | grep -Ei 'webkit|javascriptcore'; then
            echo 'The optional browser runtime became a startup dependency.' >&2
            exit 1
          fi
      - name: Verify the helper survives clean and repeated bundle installation
        if: matrix.host != 'portable-only'
        run: |
          cd "$RUNNER_TEMP/ebook-linux-host"
          helper=build/linux/x64/debug/bundle/lib/crisp_ebook_reader_probe
          test -x "$helper"
          test "$(stat -c '%a' "$helper")" = 755
          readelf -d "$helper" | tee native-helper-dependencies.log
          if readelf -d "$helper" | grep 'NEEDED' | grep -Ei 'webkit|javascriptcore'; then
            echo 'The startup helper must load the optional runtime dynamically.' >&2
            exit 1
          fi
          cmake --install build/linux/x64/debug --config Debug
          test -x "$helper"
          test "$(stat -c '%a' "$helper")" = 755
      - name: Prove the enabled build launches when the optional runtime is absent
        if: matrix.host != 'portable-only'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
        run: |
          cd "$RUNNER_TEMP/ebook-linux-host"
          flutter build linux --debug --no-pub -t lib/runtime_probe.dart
          # This is the disposable CI runner, after all rendering tests and the
          # real-header build. Do not rebuild after removing the runtime.
          sudo apt-get remove -y libwebkit2gtk-4.1-0
          set -o pipefail
          xvfb-run -a dbus-run-session -- \
            timeout 30s build/linux/x64/debug/bundle/crisp_linux_host_smoke \
            2>&1 | tee runtime-missing-launch.log
          grep '"available":false' runtime-missing-launch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebook-linux-host-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/ebook-linux-host/linux-host-test.log
            ${{ runner.temp }}/ebook-linux-host/native-dependencies.log
            ${{ runner.temp }}/ebook-linux-host/native-helper-dependencies.log
            ${{ runner.temp }}/ebook-linux-host/native-backtrace.log
            ${{ runner.temp }}/ebook-linux-host/native-milestones.log
            ${{ runner.temp }}/ebook-linux-host/runtime-missing-launch.log
            ${{ runner.temp }}/ebook-linux-host/build/linux-host-evidence/**
