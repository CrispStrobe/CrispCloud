name: Android Firebase Beta

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes shown to beta testers'
        required: false
        default: 'CrispCloud Android beta: please test sign-in, browsing, transfers, previews, and background uploads.'
        type: string
      groups:
        description: 'Comma-separated Firebase tester groups (optional)'
        required: false
        type: string
      testers:
        description: 'Comma-separated tester email addresses (optional)'
        required: false
        type: string

concurrency:
  group: firebase-android-beta
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Configure stable Android beta signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${STORE_PASSWORD:?ANDROID_STORE_PASSWORD is required}"
          echo "$KEYSTORE_B64" | base64 --decode > android/firebase-upload.jks
          chmod 600 android/firebase-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=firebase-upload.jks
          EOF

      - name: Build signed release APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define=APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)" \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          jarsigner -verify -strict -certs "$APK" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispcloud-android-firebase-beta
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Authenticate Firebase
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${SERVICE_ACCOUNT_JSON:?FIREBASE_SERVICE_ACCOUNT_JSON is required}"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Distribute through Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTER_GROUPS: ${{ inputs.groups }}
          TESTER_EMAILS: ${{ inputs.testers }}
        run: |
          set -euo pipefail
          : "${FIREBASE_APP_ID:?FIREBASE_APP_ID_ANDROID is required}"
          npm install --global firebase-tools
          args=("$APK" --app "$FIREBASE_APP_ID" --release-notes "$RELEASE_NOTES")
          if [ -n "$TESTER_GROUPS" ]; then args+=(--groups "$TESTER_GROUPS"); fi
          if [ -n "$TESTER_EMAILS" ]; then args+=(--testers "$TESTER_EMAILS"); fi
          firebase appdistribution:distribute "${args[@]}"

