name: Google Play API

on:
  workflow_dispatch:
    inputs:
      command:
        description: Operation to perform
        required: true
        default: probe
        type: choice
        options:
          - probe
          - sync-listing
          - configure-closed
          - upload-and-stage
      track:
        description: Closed-track identifier (used by configure-closed)
        required: false
        default: alpha
        type: string
      release_status:
        description: Closed release status; completed requires a fully configured app
        required: false
        default: draft
        type: choice
        options:
          - draft
          - completed
      bundle_run_id:
        description: Google Play Bundle workflow run ID (used by upload-and-stage)
        required: false
        type: string

concurrency:
  group: google-play-api
  cancel-in-progress: false

jobs:
  play-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure Google Play credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${SERVICE_ACCOUNT_JSON:?FIREBASE_SERVICE_ACCOUNT_JSON is required}"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-play-service-account.json"

      - name: Install Google authentication library
        run: python3 -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Download signed bundle
        if: inputs.command == 'upload-and-stage'
        uses: actions/download-artifact@v4
        with:
          name: crispcloud-google-play-aab
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bundle_run_id }}
          path: ${{ runner.temp }}/play-bundle

      - name: Run Google Play operation
        run: |
          args=("${{ inputs.command }}" \
            --credentials "$RUNNER_TEMP/google-play-service-account.json" \
            --track "${{ inputs.track }}" \
            --status "${{ inputs.release_status }}")
          if [ "${{ inputs.command }}" = upload-and-stage ]; then
            bundle_path="$(find "$RUNNER_TEMP/play-bundle" -type f -name '*.aab' -print -quit)"
            : "${bundle_path:?No AAB downloaded from the requested workflow run}"
            args+=(--bundle-path "$bundle_path")
          fi
          python3 tool/google_play_api.py "${args[@]}"
