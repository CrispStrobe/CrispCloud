name: Google Play Bundle

on:
  workflow_dispatch:

concurrency:
  group: google-play-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Resolve dependencies and check crypto compatibility
        run: |
          flutter pub get --enforce-lockfile
          python3 tool/crypto_release_evidence.py --check
          flutter test --no-pub test/aes_siv_test.dart test/cryptomator_test.dart \
            test/veracrypt_header_vectors_test.dart test/internxt_secure_config_test.dart \
            test/crypto_paths_test.dart test/filen_adapter_test.dart \
            test/filen_bounded_transfer_test.dart test/internxt_rewire_test.dart \
            test/internxt_download_path_test.dart test/internxt_bounded_transfer_test.dart \
            test/tls_verification_test.dart test/custom_ca_test.dart \
            test/secure_storage_test.dart \
            test/secure_storage_file_test.dart \
            test/secure_storage_web_test.dart \
            test/secure_storage_macos_keychain_test.dart \
            test/credential_storage_config_test.dart \
            test/credential_storage_bootstrap_test.dart \
            test/credential_storage_first_setup_test.dart \
            test/credential_storage_setup_test.dart \
            test/credential_storage_settings_test.dart \
            test/web_master_password_gate_test.dart \
            test/background_sync_mobile_test.dart \
            test/security_features_test.dart \
            test/backup_encryption_security_test.dart

      - name: Configure Play upload signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${STORE_PASSWORD:?ANDROID_STORE_PASSWORD is required}"
          echo "$KEYSTORE_B64" | base64 --decode > android/play-upload.jks
          chmod 600 android/play-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=play-upload.jks
          EOF

      - name: Build signed Android App Bundle
        run: |
          set -euo pipefail
          set +e
          flutter build appbundle --release --no-pub \
            --dart-define=APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)" \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"
          build_status=$?
          set -e

          AAB="$(find . -type f -name app-release.aab -not -path '*/intermediates/*' -print -quit)"
          if [ -z "$AAB" ] || [ ! -s "$AAB" ]; then
            echo "Flutter exited with status $build_status and no release AAB was produced." >&2
            if [ "$build_status" -eq 0 ]; then exit 1; fi
            exit "$build_status"
          fi
          if [ "$(stat -c%s "$AAB")" -lt 5000000 ]; then
            echo "AAB is unexpectedly small: $AAB" >&2
            exit 1
          fi
          # `-strict` exits with code 4 for the expected self-signed upload
          # certificate warning, even though the bundle is correctly signed.
          # Play App Signing replaces this upload signature for users.
          jarsigner -verify -certs "$AAB" > /tmp/jarsigner-verification.txt
          grep -q "jar verified" /tmp/jarsigner-verification.txt
          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          bundle_path="CrispCloud-${app_version/+/-build-}.aab"
          cp "$AAB" "$bundle_path"
          echo "BUNDLE_PATH=$bundle_path" >> "$GITHUB_ENV"

      - name: Record the Play bundle's crypto release evidence
        run: |
          set -euo pipefail
          mkdir -p build/export-compliance
          dart pub deps --json > build/export-compliance/dependencies.json
          python3 tool/crypto_release_evidence.py --platform android --require-clean --record-generated-metadata \
            --artifact "$BUNDLE_PATH" --dependencies build/export-compliance/dependencies.json

      - name: Upload Play bundle artifact and crypto evidence
        uses: actions/upload-artifact@v4
        with:
          name: crispcloud-google-play-aab
          path: |
            ${{ env.BUNDLE_PATH }}
            build/export-compliance/
          if-no-files-found: error
          retention-days: 30
