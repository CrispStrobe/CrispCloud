name: Image editor

on:
  push:
    branches: [main, feature/f4-pro-image-editor]
    paths:
      - '.github/workflows/image-editor.yml'
      - 'pubspec.*'
      - 'lib/**'
      - 'packages/pro_image_editor/**'
      - 'test/**'
      - 'tool/check_image_editor_i18n.py'
      - 'tool/prepare_image_editor_browser_test.py'
      - 'tool/build_image_editor_worker.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-editor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  host:
    name: Image contracts and real file round trips
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format image integration
        run: >-
          dart format --set-exit-if-changed
          lib/l10n/image_editor*.dart lib/services/image_*.dart
          lib/widgets/image_editor*.dart lib/widgets/image_export_dialog.dart test/image_*.dart
          test/widget/image_editor*.dart test/support/image_editor*.dart
      - name: Analyze integration
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/l10n/image_editor_strings.dart lib/l10n/image_editor_translations.dart
          lib/services/image_edit_session.dart lib/services/image_file_store.dart
          lib/services/pdf_file_store.dart
          lib/services/image_editor_menu.dart lib/services/image_export_options.dart
          lib/services/image_edit_project.dart lib/services/image_project_store.dart
          lib/services/image_overlay.dart lib/services/image_gif_codec.dart
          lib/services/image_raster_codec.dart
          lib/services/image_device_export.dart lib/services/image_device_export_native.dart
          lib/services/image_device_export_web.dart lib/widgets/image_export_dialog.dart
          lib/widgets/image_editor_dialog.dart
          lib/widgets/image_editor_surface.dart lib/widgets/image_editor_menus.dart
          lib/widgets/file_editor_dialog.dart lib/utils/file_editability.dart
          lib/screens/screen_dialogs.dart
          test/image_edit_session_test.dart test/image_file_store_test.dart
          test/image_export_options_test.dart test/image_device_export_test.dart
          test/image_edit_project_test.dart test/image_project_store_test.dart
          test/image_webp_file_store_test.dart test/image_gif_codec_test.dart
          test/image_gif_file_store_test.dart test/image_overlay_test.dart
          test/image_raster_codec_test.dart
          test/image_editor_live_test.dart test/image_editor_menu_test.dart
          test/widget/image_editor_menus_test.dart
          test/widget/image_editor_routing_test.dart
          test/widget/image_editor_dialog_test.dart
          test/widget/image_editor_apply_lifecycle_test.dart
          test/image_editor_strings_test.dart
      - name: Check every exposed localization field
        run: python3 tool/check_image_editor_i18n.py
      - name: Session, source, disk, routing, and menu regressions
        if: success() || failure()
        run: >-
          flutter test --reporter expanded --concurrency=2
          test/image_edit_session_test.dart test/image_file_store_test.dart
          test/image_export_options_test.dart test/image_device_export_test.dart
          test/image_edit_project_test.dart test/image_project_store_test.dart
          test/image_webp_file_store_test.dart test/image_gif_codec_test.dart
          test/image_gif_file_store_test.dart test/image_overlay_test.dart
          test/image_raster_codec_test.dart
          test/image_editor_live_test.dart test/image_editor_menu_test.dart
          test/file_editability_test.dart test/pdf_file_store_test.dart
          test/widget/image_editor_menus_test.dart
          test/widget/image_editor_routing_test.dart
      - name: Localization coverage
        if: success() || failure()
        run: flutter test --reporter expanded test/image_editor_strings_test.dart
      - name: Real image editor lifecycle
        if: success() || failure()
        run: >-
          flutter test --reporter expanded --concurrency=1
          test/widget/image_editor_dialog_test.dart
          test/widget/image_editor_apply_lifecycle_test.dart
      - name: Record formatting and dependency changes for review
        if: always()
        run: |
          mkdir -p build/image_editor_verification
          git diff --binary > build/image_editor_verification/ci-updates.patch
          python3 - <<'PY'
          import base64, gzip, pathlib
          patch = pathlib.Path('build/image_editor_verification/ci-updates.patch').read_bytes()
          if patch:
              print('IMAGE_EDITOR_PATCH_BEGIN')
              print(base64.b64encode(gzip.compress(patch, mtime=0)).decode())
              print('IMAGE_EDITOR_PATCH_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-editor-review-patch
          path: build/image_editor_verification/

  browser:
    name: Image editor in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build the worker from the locked application dependencies
        run: python3 tool/build_image_editor_worker.py --check
      - name: Serve the production image worker in the Flutter test harness
        run: python3 tool/prepare_image_editor_browser_test.py
      - name: Browser routing and native-menu bridge
        run: >-
          flutter test --reporter expanded --platform chrome --concurrency=1
          test/widget/image_editor_menus_test.dart
          test/widget/image_editor_routing_test.dart
      - name: Real browser edits and export
        if: success() || failure()
        run: >-
          flutter test --reporter expanded --platform chrome --concurrency=1
          test/widget/image_editor_dialog_test.dart
          test/widget/image_editor_apply_lifecycle_test.dart

  fork:
    name: Maintained image engine regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pro_image_editor
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the application dependency lock for the shipped worker
        working-directory: .
        run: flutter pub get
      - name: Build the shipped worker and preserve reviewable output
        working-directory: .
        run: python3 tool/build_image_editor_worker.py --check --emit-review
      - run: flutter pub get
      - name: Analyze maintained engine
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test/crispcloud
      - run: flutter test --reporter expanded test/crispcloud
      - name: Real browser worker failures remain recoverable
        run: flutter test --reporter expanded --platform chrome test/crispcloud/web_worker_failure_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-editor-worker-build
          path: build/image_editor_worker/
