name: iOS Release (App Store)

# Builds, signs and uploads the iOS app to App Store Connect from CI.
#
# Triggers:
#   * push a tag matching ios-v*        -> full build + upload (a real release)
#   * manual "Run workflow"         -> choose dry_run=true to build+sign WITHOUT
#                                      uploading (validates signing safely)
#
# Requires these repo secrets (all already set via `gh secret set`):
#   ASC_API_KEY_P8_BASE64  base64 of AuthKey_<KEYID>.p8
#   ASC_KEY_ID             App Store Connect API key id            (9RMU3C7422)
#   ASC_ISSUER_ID          App Store Connect issuer id
#   ASC_APP_ID             numeric app id                          (6789984849)
#   ASC_TEAM_ID            Apple Developer team id                 (N9XSJ4M3GT)
#   DIST_CERT_P12_BASE64   base64 of the "Apple Distribution" .p12 (cert + key)
#   DIST_CERT_PASSWORD     password for that .p12
#   ASC_PROFILE_BASE64     base64 of the IOS_APP_STORE .mobileprovision
#
# The build number comes from pubspec.yaml (version: x.y.z+BUILD). Bump BUILD
# before tagging, or Apple rejects a duplicate CFBundleVersion.

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true
      distribute_testflight:
        description: 'After upload, enable reviewed internal testing and submit external beta review'
        type: boolean
        default: false

env:
  # The xcode-27 image starts steps without a UTF-8 locale, so codesign decodes
  # the identity name "...Ströbele..." as MacRoman ("Str√∂bele") and reports
  # "no identity found". Force UTF-8 for every step.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  BUNDLE_ID: com.CrispStrobe.cloud
  PROFILE_NAME: CrispCloud AppStore CI
  # The app embeds a FileProvider extension (its own bundle id) — it needs its
  # OWN App Store profile in the ExportOptions map, or -exportArchive signs the
  # .appex without entitlements (ITMS-90166) and Apple rejects the upload.
  FILEPROVIDER_BUNDLE_ID: com.CrispStrobe.cloud.FileProvider
  FILEPROVIDER_PROFILE_NAME: CrispCloud FileProvider AppStore CI
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-upload:
    # ITMS-90725: from April 2027 App Store Connect only accepts builds made
    # with the 27 SDKs (Xcode 27). The standard macOS images (incl.
    # macos-15-intel, where 1.2.7 "resilient Apple CI" moved all Mac jobs; no
    # x86-only tooling found) only ship Xcode 26.x, so the store build runs on
    # GitHub's xcode-27 image (arm64) and fails before signing if the SDK is
    # older.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 27 and require the iOS 27 SDK
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo "::error::iOS SDK $SDK < 27 (ITMS-90725)"; exit 1
          fi
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prime pinned Apple SQLite cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/prime_apple_sqlite_cache.sh

      - name: Check crypto release inputs and compatibility
        run: |
          python3 tool/crypto_release_evidence.py --check
          python3 tool/with_ci_apple_sqlite.py -- flutter test --no-pub test/aes_siv_test.dart test/cryptomator_test.dart \
            test/keepass_crypto_test.dart test/keepass_service_test.dart test/keepass_extended_service_test.dart \
            test/veracrypt_header_vectors_test.dart test/veracrypt_compatibility_test.dart test/veracrypt_container_reader_test.dart test/veracrypt_header_worker_test.dart test/internxt_secure_config_test.dart \
            test/crypto_paths_test.dart test/filen_adapter_test.dart \
            test/filen_crypto_validation_test.dart test/encryption_key_lifecycle_test.dart \
            test/file_encryption_recovery_test.dart \
            test/filen_bounded_transfer_test.dart test/internxt_rewire_test.dart \
            test/internxt_download_path_test.dart test/internxt_bounded_transfer_test.dart \
            test/tls_verification_test.dart test/custom_ca_test.dart \
            test/secure_storage_test.dart \
            test/secure_storage_file_test.dart \
            test/secure_storage_web_test.dart \
            test/secure_storage_macos_keychain_test.dart \
            test/credential_storage_config_test.dart \
            test/credential_storage_bootstrap_test.dart \
            test/credential_storage_first_setup_test.dart \
            test/credential_storage_recovery_test.dart \
            test/credential_storage_recovery_widget_test.dart \
            test/config_services_test.dart \
            test/credential_storage_setup_test.dart \
            test/credential_storage_settings_test.dart \
            test/web_master_password_gate_test.dart \
            test/background_sync_mobile_test.dart \
            test/security_features_test.dart \
            test/backup_encryption_security_test.dart

      - name: Import signing certificate into a temp keychain
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/nn-signing.keychain-db"
          # Empty password: on the xcode-27 image unlock-keychain rejects the
          # password the keychain was just created with (runner-images#14837).
          # The keychain lives in RUNNER_TEMP on a single-use VM.
          KC_PW=""
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          # keep the default (login) keychain on the search list too
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"

      - name: Install provisioning profiles (app + FileProvider extension)
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_BASE64 }}
          FILEPROVIDER_PROFILE_B64: ${{ secrets.ASC_PROFILE_FILEPROVIDER_BASE64 }}
        run: |
          set -euo pipefail
          install_profile() {
            local b64="$1" tmp
            tmp="$RUNNER_TEMP/$(uuidgen).mobileprovision"
            echo "$b64" | base64 --decode > "$tmp"
            local plist uuid name
            plist="$(security cms -D -i "$tmp")"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$plist")
            # Install into BOTH the legacy dir and the Xcode 16+/26 dir.
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"
              cp "$tmp" "$DIR/$uuid.mobileprovision"
            done
            echo "installed profile '$name' ($uuid)"
          }
          install_profile "$PROFILE_B64"
          install_profile "$FILEPROVIDER_PROFILE_B64"

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Write ExportOptions.plist (manual signing)
        run: |
          cat > .appstoreconnect/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string>
              <key>${{ env.FILEPROVIDER_BUNDLE_ID }}</key><string>${{ env.FILEPROVIDER_PROFILE_NAME }}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Build & sign IPA (xcodebuild, manual signing)
        run: |
          set -euo pipefail
          # Derive marketing version + build number from pubspec so we can inject
          # them as build settings below (see the version note on the archive).
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          # Let Flutter generate its ephemeral iOS config (Generated.xcconfig +
          # FlutterGeneratedPluginSwiftPackage) and the CocoaPods integration
          # WITHOUT building — this sets the Flutter.framework search paths that a
          # bare xcodebuild would otherwise miss in the SPM/CocoaPods hybrid.
          PATH="/usr/bin:$PATH" flutter build ios --release --no-pub --config-only --no-codesign \
            --dart-define=CRISP_DISTRIBUTION=appstore --dart-define=CRISP_ENABLE_FUSE=false \
            --dart-define=APP_VERSION="$VER+$BUILD" \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"
          PATH="/usr/bin:$PATH" env -u GEM_HOME -u GEM_PATH -u RUBYOPT \
            pod install --project-directory=ios
          # Xcode 27 rejects (error, not warning) any target below iOS 15.0, and
          # several pods still declare 12.0/13.0. Raise only those pod targets
          # in the generated Pods project; app/extension targets are untouched.
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = (\d+)(\.\d+)*;/$1 < 15 ? "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" : $&/ge' \
            ios/Pods/Pods.xcodeproj/project.pbxproj
          # ARCHIVE UNSIGNED. A bare `xcodebuild archive` insists on an iOS
          # *Development* profile for on-device signing, which CI can't have (only
          # the Distribution cert's private key is available, not a Development
          # one). Skip signing at archive time, then let -exportArchive apply the
          # Distribution signing (imported cert + installed App Store profile) —
          # the standard "sign at export" CI pattern. No account, no dev cert, no
          # -allowProvisioningUpdates (which churns certs).
          # FLUTTER_BUILD_NUMBER / FLUTTER_BUILD_NAME are defined only for the
          # Runner target (via Generated.xcconfig), so the FileProvider
          # extension's Info.plist `$(FLUTTER_BUILD_NUMBER)` resolves to EMPTY —
          # Apple then rejects the .appex for a missing CFBundleVersion
          # (ITMS-90360/90056). Inject both as global build settings so every
          # target (app + extension) stamps the same version. Version-only
          # settings are safe to pass globally (unlike signing settings, which
          # would force a profile onto every Pod framework).
          PATH="/usr/bin:$PATH" python3 tool/with_ci_apple_sqlite.py -- xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            FLUTTER_BUILD_NAME="$VER" FLUTTER_BUILD_NUMBER="$BUILD" \
            clean archive
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist .appstoreconnect/ExportOptions.plist
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "built: $IPA"
          unzip -qo "$IPA" -d /tmp/ipa_check
          codesign --verify --deep --strict --verbose=2 /tmp/ipa_check/Payload/Runner.app 2>&1 | tail -2

      - name: Re-sign with the App Group entitlement
        run: |
          set -euo pipefail
          # WHY: the archive is built CODE_SIGNING_ALLOWED=NO, so
          # CODE_SIGN_ENTITLEMENTS is never baked; -exportArchive then re-signs
          # each binary from a DEFAULT entitlement set that omits
          # com.apple.security.application-groups. The FileProvider's required
          # Info.plist key NSExtensionFileProviderDocumentGroup then has no
          # backing entitlement and Apple rejects the upload (ITMS-90362).
          # Re-sign the .appex and the app with their CURRENT entitlements PLUS
          # the app group (the installed profiles now authorize it).
          # Select by SHA-1: codesign on the xcode-27 image cannot match the
          # name "...Ströbele..." even under a UTF-8 locale ("no identity found").
          IDENT=$(security find-identity -v -p codesigning \
            | awk '/Apple Distribution: / {print $2; exit}')
          [ -n "$IDENT" ] || { echo "::error::Apple Distribution identity missing"; exit 1; }
          echo "signing identity: $IDENT"
          GROUP=group.com.crispcloud.shared
          WORK="$RUNNER_TEMP/resign"; rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP="$WORK/Payload/Runner.app"
          EXT="$APP/PlugIns/CrispCloudFileProvider.appex"
          resign() {
            local target="$1" ent="$RUNNER_TEMP/$(basename "$1").ent.plist"
            codesign -d --entitlements - --xml "$target" 2>/dev/null > "$ent"
            plutil -convert xml1 "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.application-groups" "$ent" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" "$ent"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string $GROUP" "$ent"
            echo "--- $(basename "$target") entitlements ---"; cat "$ent"
            codesign --force --sign "$IDENT" --entitlements "$ent" "$target"
          }
          resign "$EXT"          # nested first, then the containing app
          resign "$APP"
          # Fail loud if the group didn't make it into the signed .appex.
          codesign -d --entitlements - --xml "$EXT" 2>/dev/null | grep -q "$GROUP" \
            || { echo "::error::app group still missing from the .appex after re-sign"; exit 1; }
          echo "✓ app group embedded in the .appex"
          RESIGNED="$RUNNER_TEMP/CrispCloud-resigned.ipa"
          ( cd "$WORK" && zip -qr "$RESIGNED" Payload )
          echo "IPA=$RESIGNED" >> "$GITHUB_ENV"

      - name: Record the submitted IPA's crypto release evidence
        run: |
          set -euo pipefail
          mkdir -p build/export-compliance
          dart pub deps --json > build/export-compliance/dependencies.json
          python3 tool/crypto_release_evidence.py --platform ios --require-clean --record-generated-metadata \
            --artifact "$IPA" --dependencies build/export-compliance/dependencies.json
          python3 tool/apple_export_preflight.py --platform ios --check-artifact \
            --artifact "$IPA" --output build/export-compliance/apple-artifact.json

      - name: Capture unapproved iOS project changes on failure
        if: failure()
        run: python3 tool/record_native_project_diagnostics.py ios

      - name: Upload iOS source diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-source-diagnostics
          path: build/source-diagnostics/ios/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload IPA artifact and crypto evidence
        uses: actions/upload-artifact@v4
        with:
          name: CrispCloud-ios-ipa
          path: |
            ${{ env.IPA }}
            build/export-compliance/
          if-no-files-found: error

      - name: Check distribution component boundary
        run: python3 tool/check_distribution_components.py --artifact "$IPA"

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_PATH: .appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          set -euo pipefail
          # GET-only check of the exact signed artifact and live store evidence.
          # Any missing/pending France review stops before the upload command.
          python3 tool/apple_export_preflight.py --platform ios --artifact "$IPA"
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Uploading $VER (build $BUILD)"
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VER" \
            --api-key "${{ secrets.ASC_KEY_ID }}" \
            --api-issuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Distribute to reviewed internal and external TestFlight groups
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.distribute_testflight == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_PATH: .appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_BUNDLE_ID: com.CrispStrobe.cloud
          ASC_PLATFORM: IOS
          TESTFLIGHT_INCLUDE_INTERNAL: '1'
          TESTFLIGHT_WHAT_TO_TEST: >-
            Test browsing, transfers, previews and editing, SSH jump hosts,
            terminal pane layouts and reconnect, and Zotero references in Word.
        run: |
          set -euo pipefail
          export ASC_BUILD_NUMBER="$(sed -n 's/^version: .*+//p' pubspec.yaml)"
          ruby tool/testflight_external.rb

      - name: Retain live Apple export preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-apple-export-preflight
          path: build/export-compliance/apple-export-preflight.json
          if-no-files-found: ignore
          retention-days: 90
