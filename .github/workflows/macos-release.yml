name: macOS Release (App Store)

# Builds, signs and uploads the macOS app to App Store Connect.
#
# Lands on the SAME app record as iOS (6789570314) because the macOS target's
# bundle id is com.CrispStrobe.cloud, identical to iOS, and that id is
# registered UNIVERSAL in the developer portal. App Store Connect serves
# multiple platforms from one record only when the bundle id matches — which
# also avoids app-record creation, the one step that is browser-only.
#
# Triggers:
#   * push a tag matching macos-v*  -> full build + upload
#   * manual "Run workflow"         -> dry_run=true (default) builds and signs
#                                      but does NOT upload
#
# Why this does NOT use `xcodebuild -exportArchive` like ios-release.yml:
# the archive is built unsigned, and -exportArchive then re-signs each binary
# from a DEFAULT entitlement set. On iOS that silently dropped the app group
# (ITMS-90362). On macOS it would drop `com.apple.security.app-sandbox`, which
# the Mac App Store requires — an automatic rejection. So we sign the .app
# explicitly with the project's own entitlements files, then wrap it with
# productbuild. Same shape as the CrispSorter macOS job.

on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign only, do NOT upload'
        type: boolean
        default: true

env:
  BUNDLE_ID: com.CrispStrobe.cloud
  PROFILE_NAME: CrispCloud macOS AppStore
  FINDEREXT_BUNDLE_ID: com.CrispStrobe.cloud.FinderExtension
  FINDEREXT_PROFILE_NAME: CrispCloud FinderExtension macOS AppStore
  FLUTTER_VERSION: '3.44.2'

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use pure CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import signing certificates into a temp keychain
        # NOT DIST_CERT_P12_BASE64: that one holds only the Apple Distribution
        # identity (verified — a dry run failed the installer guard with
        # "1 identity imported"). Mac App Store needs a SECOND identity to sign
        # the .pkg, so MAC_SIGNING_P12_BASE64 carries both.
        env:
          P12_B64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PW: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/cc-macos.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          # -T productbuild as well: the .pkg is signed by the installer identity
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" "$KC" >/dev/null
          echo "KC=$KC" >> "$GITHUB_ENV"
          security find-identity -v "$KC"
          # Mac App Store needs BOTH identities. Fail loudly and early rather
          # than 40 minutes later at productbuild.
          security find-identity -v "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::Apple Distribution identity missing from MAC_SIGNING_P12_BASE64"; exit 1; }
          security find-identity -v "$KC" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "::error::3rd Party Mac Developer Installer identity missing from MAC_SIGNING_P12_BASE64 — MAC_SIGNING_P12_BASE64 must contain both"; exit 1; }

      - name: Install provisioning profiles (app + Finder extension)
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_MACOS_BASE64 }}
          FINDEREXT_PROFILE_B64: ${{ secrets.ASC_PROFILE_MACOS_FINDEREXT_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profiles"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profiles/app.provisionprofile"
          echo "$FINDEREXT_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profiles/ext.provisionprofile"
          for f in app ext; do
            p="$RUNNER_TEMP/profiles/$f.provisionprofile"
            plist="$(security cms -D -i "$p")"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$plist")
            DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$DIR"; cp "$p" "$DIR/$uuid.provisionprofile"
            echo "installed '$name' ($uuid)"
          done

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" .appstoreconnect
          echo "$P8_B64" | base64 --decode > ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          cp ".appstoreconnect/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Build the .app (unsigned — we sign explicitly below)
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          # FLUTTER_BUILD_NAME/NUMBER are defined only for the Runner target, so
          # the Finder extension's Info.plist would resolve CFBundleVersion to
          # empty (ITMS-90360/90056 on the iOS side). Inject globally.
          PATH="/usr/bin:$PATH" flutter build macos --release \
            --build-name="$VER" --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VER" \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "built: $APP"

      - name: Sign .app + extension with their real entitlements
        run: |
          set -euo pipefail
          IDENT=$(security find-identity -v "$KC" | grep -oE 'Apple Distribution: [^"]+' | head -1)
          echo "signing identity: $IDENT"
          EXT="$APP/Contents/PlugIns/FinderExtension.appex"
          # Embed the profiles — a Mac App Store binary must carry
          # embedded.provisionprofile or Apple rejects it at delivery.
          cp "$RUNNER_TEMP/profiles/app.provisionprofile" "$APP/Contents/embedded.provisionprofile"
          if [ -d "$EXT" ]; then
            cp "$RUNNER_TEMP/profiles/ext.provisionprofile" "$EXT/Contents/embedded.provisionprofile"
          else
            echo "::warning::FinderExtension.appex not present in the build output"
          fi
          # `codesign --entitlements <file>` signs in EXACTLY what the file
          # contains — nothing is inherited. The project's .entitlements files
          # carry only sandbox/network keys, so the signed bundles came out with
          # no `com.apple.application-identifier`, which altool rejects with:
          #   90886 "the signature ... is missing an application identifier but
          #   has an application identifier in the provisioning profile"
          # Build augmented copies that add the App Store identity keys. Same
          # class of bug as the iOS app group: entitlements must be COMPLETE at
          # signing time, not merely authorized by the profile.
          TEAM="${{ secrets.ASC_TEAM_ID }}"
          mkents() {  # mkents <source .entitlements> <bundle id> -> path
            local src="$1" bid="$2" out="$RUNNER_TEMP/$(basename "$1").signed.plist"
            cp "$src" "$out"
            /usr/libexec/PlistBuddy -c "Delete :com.apple.application-identifier" "$out" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.team-identifier" "$out" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM.$bid" "$out"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM" "$out"
            echo "$out"
          }
          # Sign nested-first: frameworks, then the extension, then the app.
          find "$APP/Contents/Frameworks" -name '*.framework' -maxdepth 1 -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$IDENT" {} || true
          find "$APP/Contents/Frameworks" -name '*.dylib' -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$IDENT" {} || true
          if [ -d "$EXT" ]; then
            EXT_ENT=$(mkents macos/FinderExtension/FinderExtension.entitlements "${{ env.FINDEREXT_BUNDLE_ID }}")
            echo "--- extension entitlements ---"; cat "$EXT_ENT"
            codesign --force --timestamp --options runtime --sign "$IDENT" \
              --entitlements "$EXT_ENT" "$EXT"
          fi
          APP_ENT=$(mkents macos/Runner/Release.entitlements "${{ env.BUNDLE_ID }}")
          echo "--- app entitlements ---"; cat "$APP_ENT"
          codesign --force --timestamp --options runtime --sign "$IDENT" \
            --entitlements "$APP_ENT" "$APP"
          # Fail loud if the application-identifier didn't make it in (90886).
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q "com.apple.application-identifier" \
            || { echo "::error::application-identifier missing from the signed .app"; exit 1; }
          if [ -d "$EXT" ]; then
            codesign -d --entitlements - --xml "$EXT" 2>/dev/null \
              | grep -q "com.apple.application-identifier" \
              || { echo "::error::application-identifier missing from the signed .appex"; exit 1; }
          fi
          # The Mac App Store REQUIRES the sandbox entitlement. Verify it stuck
          # rather than discovering it in Apple's async processing.
          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::app-sandbox entitlement missing from the signed .app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3

      - name: Launch signed sandboxed app
        run: tool/macos_startup_smoke.sh "$APP" 12

      - name: Build the signed .pkg
        run: |
          set -euo pipefail
          INST=$(security find-identity -v "$KC" \
            | grep -oE '3rd Party Mac Developer Installer: [^"]+' | head -1)
          echo "installer identity: $INST"
          PKG="$RUNNER_TEMP/CrispCloud-${VER}-${BUILD}.pkg"
          productbuild --component "$APP" /Applications --sign "$INST" "$PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          pkgutil --check-signature "$PKG" | head -5

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrispCloud-macos-pkg
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Validate with altool
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f "$PKG" --type macos \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tail -20

      - name: Upload to App Store Connect
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          xcrun altool --upload-package "$PKG" --type macos \
            --apple-id "${{ secrets.ASC_APP_ID }}" \
            --bundle-id "${{ env.BUNDLE_ID }}" \
            --bundle-version "$BUILD" --bundle-short-version-string "$VER" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tail -20

      - name: Note when the upload was skipped
        if: github.event_name != 'push' && inputs.dry_run != false
        run: echo "::notice::dry_run — built and signed, upload SKIPPED. Re-run with dry_run=false to upload."
