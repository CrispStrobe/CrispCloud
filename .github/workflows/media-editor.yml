name: Media editor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-editor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contracts:
    name: Media contracts and real audio exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve application dependencies
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          flutter pub get
      - name: Build the shipped audio engine
        run: |
          mkdir -p build/media-native
          g++ -std=c++17 -O2 -fPIC -fvisibility=hidden -D_FILE_OFFSET_BITS=64 \
            -shared packages/crisp_audio/src/crisp_audio.cpp \
            -o build/media-native/libcrisp_audio.so -lm
      - name: Install independent audio inspectors with bounded mirror fallback
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          download_ffmpeg() {
            sudo timeout --kill-after=5s 45s apt-get update -qq &&
              sudo timeout --kill-after=5s 90s apt-get install --download-only -y ffmpeg
          }
          if ! download_ffmpeg; then
            echo "::warning::FFmpeg download failed or timed out; retrying the official Ubuntu archives."
            ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
            [[ -f "$ubuntu_sources" ]] || ubuntu_sources=/etc/apt/sources.list
            # Hosted Ubuntu uses this mirror list, not a direct Azure URI.
            # Reject an unknown layout rather than retrying the same endpoint.
            if ! grep -Eq '^[[:space:]]*(URIs:|deb[[:space:]]).*mirror\+file:/etc/apt/apt-mirrors\.txt([[:space:]]|$)' "$ubuntu_sources" ||
                grep -Fq 'azure.archive.ubuntu.com' "$ubuntu_sources"; then
              echo "::error::Unrecognized Ubuntu APT source layout; refusing an ineffective mirror fallback."
              exit 1
            fi
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
              sudo tee /etc/apt/apt-mirrors.txt
            download_ffmpeg
          fi
          # Only network acquisition is retried; do not interrupt dpkg to retry.
          sudo apt-get install --no-download -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Independent audio decode, trim, fades, cancellation and reopen
        timeout-minutes: 3
        run: |
          python3 packages/crisp_audio/native_test/test_audio.py --library build/media-native/libcrisp_audio.so
      - name: Format media integration
        run: >-
          dart format
          lib/l10n/media_editor_strings.dart lib/services/media_*.dart
          lib/widgets/media_*.dart test/media_*.dart
          test/widget/media_*.dart packages/crisp_audio/lib
          lib/services/upload_temp_file.dart test/upload_temp_file_test.dart
          integration_test/media_*test.dart
          test/support/media_video_fixture.dart
      - name: Analyze media integration
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/l10n/media_editor_strings.dart lib/services/media_edit_session.dart
          lib/services/media_capabilities.dart lib/services/media_editor_backend.dart
          lib/services/media_editor_menu.dart lib/services/media_file_store.dart
          lib/services/media_audio_backend.dart lib/services/media_video_backend.dart
          lib/widgets/media_editor_dialog.dart lib/widgets/media_editor_controls.dart
          lib/widgets/media_editor_preview.dart lib/widgets/media_editor_menus.dart
          lib/services/cloud_storage_interface.dart lib/services/encrypted_storage_wrapper.dart
          lib/services/azure_blob_adapter.dart lib/services/filen_client_adapter.dart
          lib/services/ftp_client_adapter.dart lib/services/gdrive_client_adapter.dart
          lib/services/onedrive_client_adapter.dart lib/services/pcloud_client_adapter.dart
          lib/services/upload_temp_file.dart test/upload_temp_file_test.dart
          packages/crisp_audio/lib test/media_*test.dart test/widget/media_*test.dart
          integration_test/media_export_test.dart
          integration_test/media_audio_export_test.dart integration_test/media_video_export_test.dart
      - name: File, history, platform, localization, FFI and editor lifecycle contracts
        if: success() || failure()
        env:
          CRISP_AUDIO_LIBRARY: ${{ github.workspace }}/build/media-native/libcrisp_audio.so
        run: >-
          flutter test --reporter expanded --concurrency=2
          test/media_*test.dart test/widget/media_*test.dart test/upload_temp_file_test.dart
          test/file_editability_test.dart
      - name: Web rejects unavailable media editing and remains compilable
        if: success() || failure()
        run: >-
          flutter test --reporter expanded --platform chrome --concurrency=1
          test/media_capabilities_test.dart test/widget/media_editor_routing_test.dart
      - name: Record formatting and lockfile changes for review
        if: always()
        run: |
          mkdir -p build/media-review
          git diff --binary > build/media-review/ci-updates.patch
          python3 - <<'PY'
          import base64, gzip, pathlib
          patch = pathlib.Path('build/media-review/ci-updates.patch').read_bytes()
          if patch:
              print('MEDIA_EDITOR_PATCH_BEGIN')
              print(base64.b64encode(gzip.compress(patch, mtime=0)).decode())
              print('MEDIA_EDITOR_PATCH_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-editor-review-patch
          path: build/media-review/
      - name: Require committed formatting and dependency resolution
        run: git diff --exit-code

  apple:
    name: Real AVFoundation exports and unsigned iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve application dependencies
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          flutter pub get
      - name: Install independent media inspectors
        run: command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Real native video edits, output validation and cancellation
        run: |
          mkdir -p build/media-review
          set -o pipefail
          flutter test integration_test/media_export_test.dart -d macos \
            --dart-define=MEDIA_TEST_KEEP_OUTPUT=true 2>&1 | tee build/media-review/native-video.log
      - name: Inspect native exports independently
        if: success() || failure()
        run: python3 tool/check_media_video_exports.py build/media-review/native-video.log --output-dir build/media-review/video-exports
      - name: Verify iOS plugin linking without signing
        if: success() || failure()
        run: flutter build ios --debug --no-codesign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-editor-native-video-log
          path: build/media-review/

  android:
    name: Real Media3 exports on Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve application dependencies
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/media_export_test.dart -d emulator-5554
