name: Nightly

# Scheduled nightly build — runs at 2:00 AM UTC every day.
# Builds all platforms from main and publishes/updates a "nightly" pre-release
# on GitHub Releases.
#
# The job is skipped when there are no new commits since the last nightly run
# (checked by comparing the nightly tag with HEAD).

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------- Guard: skip if no new commits since last nightly ----------
  check-changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commits since last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the SHA the current nightly release points to (if any)
          NIGHTLY_SHA=$(gh release view nightly --json targetCommitish \
            --jq '.targetCommitish' 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Nightly SHA: ${NIGHTLY_SHA:-none}"
          echo "HEAD SHA: ${HEAD_SHA}"
          if [ -z "$NIGHTLY_SHA" ] || [ "$NIGHTLY_SHA" != "$HEAD_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New commits detected — proceeding with nightly build."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since last nightly — skipping build."
          fi

  # ---------- Test gate ----------
  test:
    name: Test
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze 2>&1 | tee analyze.log || true
          if grep -q "  error • " analyze.log; then
            echo "::error::flutter analyze surfaced errors"
            exit 1
          fi

      - run: flutter test

  # ---------- Build Web ----------
  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get
      - run: flutter build web --release
      - run: tar czf crispcloud-nightly-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-web
          path: crispcloud-nightly-web.tar.gz

  # ---------- Build Linux ----------
  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar czf crispcloud-nightly-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-linux-x64
          path: crispcloud-nightly-linux-x64.tar.gz

  # ---------- Build Windows ----------
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            C:\hostedtoolcache\windows\flutter
            ~\AppData\Local\Pub\Cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-windows-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-windows-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Patch pdfx CMake (fix VERSION 2.8.12 rejected by CMake 3.30+)
        shell: bash
        run: |
          for base in . "$PUB_CACHE" "$LOCALAPPDATA/Pub/Cache" "$HOME/.pub-cache"; do
            [ -d "$base" ] || continue
            TEMPLATE=$(find "$base" -path "*/pdfx*/DownloadProject.CMakeLists.cmake.in" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.14)/' "$TEMPLATE"
              echo "Patched: $TEMPLATE"
              break
            fi
          done

      - name: Build Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-nightly-windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-windows-x64
          path: crispcloud-nightly-windows-x64.zip

  # ---------- Build macOS ----------
  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true  # macOS runners scarce on free tier
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package (.zip + .dmg)
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
          zip -r -y "$GITHUB_WORKSPACE/crispcloud-nightly-macos.zip" "$APP_NAME"
          mkdir -p dmg_contents
          cp -R "$APP_NAME" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "CrispCloud" -srcfolder dmg_contents \
            -ov -format UDZO "$GITHUB_WORKSPACE/crispcloud-nightly-macos.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-macos
          path: |
            crispcloud-nightly-macos.zip
            crispcloud-nightly-macos.dmg

  # ---------- Build Android ----------
  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release
          find build -name "*.apk" -type f 2>/dev/null || true

      - name: Find and rename APK
        run: |
          APK=$(find build -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          cp "$APK" crispcloud-nightly-android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-android
          path: crispcloud-nightly-android.apk

  # ---------- Build iOS ----------
  build-ios:
    name: Build iOS (no-codesign)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true  # macOS runners scarce on free tier
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Archive unsigned .app
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-nightly-ios-nosign.zip "$APP_PATH"
          else
            zip -r -y crispcloud-nightly-ios-nosign.zip build/ios/iphoneos/
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: nightly-ios-nosign
          path: crispcloud-nightly-ios-nosign.zip

  # ---------- Publish nightly pre-release ----------
  publish-nightly:
    name: Publish nightly release
    needs: [build-web, build-linux, build-windows, build-macos, build-android, build-ios]
    if: always() && !cancelled() && needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate nightly changelog
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "## Nightly Build — ${BUILD_DATE}"
            echo ""
            echo "Commit: \`${SHORT_SHA}\` on \`main\`"
            echo ""
            echo "### Recent commits"
            git log HEAD~10..HEAD --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || true
            echo ""
            echo ""
            echo "> **Note**: This is an automated nightly build from the \`main\` branch."
            echo "> It may be unstable. For production use, see the [latest stable release](https://github.com/${{ github.repository }}/releases/latest)."
          } > nightly-notes.md
          cat nightly-notes.md

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure the nightly tag points to HEAD
          git tag -f nightly
          git push origin nightly --force

          # Delete old nightly release if it exists
          gh release delete nightly --yes 2>/dev/null || true

          # Collect artifacts
          FILES=()
          for f in \
            artifacts/nightly-web/crispcloud-nightly-web.tar.gz \
            artifacts/nightly-linux-x64/crispcloud-nightly-linux-x64.tar.gz \
            artifacts/nightly-macos/crispcloud-nightly-macos.zip \
            artifacts/nightly-windows-x64/crispcloud-nightly-windows-x64.zip \
            artifacts/nightly-android/crispcloud-nightly-android.apk \
            artifacts/nightly-ios-nosign/crispcloud-nightly-ios-nosign.zip; do
            if [ -f "$f" ]; then
              FILES+=("$f")
              echo "Including: $f"
            else
              echo "Skipping (not found): $f"
            fi
          done

          gh release create nightly \
            --title "CrispCloud Nightly ($(date -u '+%Y-%m-%d'))" \
            --notes-file nightly-notes.md \
            --prerelease \
            "${FILES[@]}"
