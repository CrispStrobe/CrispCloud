name: Office fidelity integration
on:
  push:
    branches: [main, 'feature/office-fidelity-*']
  pull_request:
    paths:
      - 'packages/quds_office_engine/**'
      - 'packages/quds_office_editor/**'
      - 'lib/widgets/office_editor*'
      - 'lib/services/office_*'
      - 'lib/l10n/**'
      - 'assets/fonts/**'
      - 'lib/services/recursive_search_service.dart'
      - 'lib/services/captured_file_target.dart'
      - 'lib/services/pdf_file_store.dart'
      - 'lib/providers/panel_provider.dart'
      - 'test/office_*'
      - 'test/recursive_search_service_test.dart'
      - 'test/widget/office_*'
      - 'tool/*office*'
      - 'tool/office-validation/**'
      - 'tool/with_ci_system_sqlite.py'
      - 'pubspec.*'
      - '.fvmrc'
      - '.github/workflows/office-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-host-fidelity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - run: flutter pub get
      - name: Shared corpus and host save workflow
        run: python3 tool/with_ci_system_sqlite.py bash tool/check_office_fidelity.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-host-fidelity-evidence
          path: |
            build/fidelity/
            build/fidelity-host/
            packages/quds_office_engine/build/fidelity*
  external-schema:
    needs: host-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: office-host-fidelity-evidence
          path: evidence
      - name: Require every actual host export
        run: |
          python3 -m unittest discover -s tool -p test_office_host_evidence.py
          python3 tool/office_host_evidence.py verify --root evidence --report build/external/host-inventory.json
      - name: Prove validator detects invalid XML
        run: dotnet run --project tool/office-validation -- --self-test
      - name: Validate host uploads and engine exports
        run: dotnet run --no-build --project tool/office-validation -- evidence build/external/schema-report.json
      - name: Stage exact actual-host bytes for native rendering
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          report = json.loads(Path('build/external/host-inventory.json').read_text())
          assert not report['failures'] and report['verified'] == report['expected']
          destination = Path('build/external/host-input')
          destination.mkdir(parents=True, exist_ok=False)
          for item in report['files']:
              source = Path('evidence') / item['file']
              assert hashlib.sha256(source.read_bytes()).hexdigest() == item['sha256']
              target = destination / item['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PYTHON
      - name: Install independent host renderer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils fonts-liberation fonts-dejavu
      - name: Check actual-host rendering and repeated saves
        run: |
          python3 -m unittest discover -s tool/office-validation -p 'test_*.py'
          python3 tool/office-validation/render.py build/external/host-input build/external/host-render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-host-schema-evidence
          path: build/external/
