name: PDF editor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  packages:
    name: PDF package (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [dart_pdf_editor, dart_pdf_editor_secure_storage]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Store and worker regression tests
        if: success() || failure()
        run: flutter test

  web:
    name: PDF web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve application dependencies
        run: flutter pub get
      - name: Record resolved dependency lock
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          lock = pathlib.Path('pubspec.lock').read_bytes()
          print('PDF_EDITOR_LOCK_BEGIN')
          print(base64.b64encode(gzip.compress(lock, mtime=0)).decode())
          print('PDF_EDITOR_LOCK_END')
          PY
      - name: Build web application
        run: |
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)" \
            --dart-define=APP_VERSION="$APP_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-web-and-lock
          path: |
            pubspec.lock
            build/web
          retention-days: 14
