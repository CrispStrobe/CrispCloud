name: PDF editor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration:
    name: PDF integration and independent parser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting of new PDF code
        id: format
        continue-on-error: true
        run: |
          python3 tool/format_pdf_editor.py --write
          git diff --quiet -- . ':!pubspec.lock'
      - name: Independent PDF parser
        run: python3 -m pip install pypdf==6.10.0 cryptography
      - name: Validate generated inputs
        run: python3 tool/verify_pdf_editor_outputs.py --fixtures-only
      - name: PDF engine round trips
        run: flutter test test/pdf_editor_round_trip_test.dart
      - name: Verify exported PDFs independently
        run: python3 tool/verify_pdf_editor_outputs.py
      - name: Persistence, origin and editor regressions
        if: success() || failure()
        run: >-
          flutter test --concurrency=2
          test/pdf_edit_session_test.dart
          test/pdf_file_store_test.dart
          test/pdf_device_export_test.dart
          test/panel_file_origin_test.dart
          test/transfer_stream_control_test.dart
          test/widget/pdf_editor_dialog_test.dart
          test/local_file_service_test.dart
          test/file_bytes_loader_test.dart
          test/web_file_ops_test.dart
      - name: Browser editor lifecycle
        if: success() || failure()
        run: flutter test --platform chrome test/widget/pdf_editor_dialog_test.dart
      - name: Record reviewable formatting and lockfile updates
        if: always()
        run: |
          mkdir -p build/pdf_editor_verification
          git diff --binary > build/pdf_editor_verification/ci-updates.patch
          python3 - <<'PY'
          import base64, gzip, pathlib
          patch = pathlib.Path('build/pdf_editor_verification/ci-updates.patch').read_bytes()
          if patch:
              print('PDF_EDITOR_PATCH_BEGIN')
              print(base64.b64encode(gzip.compress(patch, mtime=0)).decode())
              print('PDF_EDITOR_PATCH_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-verification
          path: build/pdf_editor_verification
          retention-days: 14
      - name: Enforce formatting result
        if: always() && steps.format.outcome == 'failure'
        run: exit 1

  packages:
    name: PDF package (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [dart_pdf_editor, dart_pdf_editor_secure_storage]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Store and worker regression tests
        if: success() || failure()
        run: flutter test

  web:
    name: PDF web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve application dependencies
        run: flutter pub get
      - name: Record resolved dependency lock
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          lock = pathlib.Path('pubspec.lock').read_bytes()
          print('PDF_EDITOR_LOCK_BEGIN')
          print(base64.b64encode(gzip.compress(lock, mtime=0)).decode())
          print('PDF_EDITOR_LOCK_END')
          PY
      - name: Build web application
        run: |
          APP_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release \
            --dart-define=GIT_HASH="$(git rev-parse --short HEAD)" \
            --dart-define=APP_VERSION="$APP_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-editor-web-and-lock
          path: |
            pubspec.lock
            build/web
          retention-days: 14
