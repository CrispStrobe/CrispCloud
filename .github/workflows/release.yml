name: Release

# Builds release artifacts for all platforms and creates a GitHub Release.
#
# Triggered by:
#   - Pushing a tag like v0.1.0 → creates a full stable release
#   - Manual dispatch (workflow_dispatch) → creates a GitHub pre-release
#
# Artifacts:
#   - Web:     .tar.gz of build/web
#   - macOS:   .zip of .app bundle  (code-sign placeholder — see below)
#   - Linux:   .tar.gz of bundle
#   - Windows: .zip of release bundle  (code-sign placeholder — see below)
#   - Android: APK  (keystore-sign placeholder — see below)
#   - iOS:     .zip of unsigned .app  (export placeholder — see below)
#
# ─── CODE SIGNING — HOW TO ENABLE ────────────────────────────────────────────
#
#  macOS (Developer ID):
#    Required secrets:
#      MACOS_CERT_P12          – base64-encoded Developer ID certificate (.p12)
#      MACOS_CERT_PASSWORD     – password for the .p12
#      MACOS_NOTARY_APPLE_ID   – Apple ID for notarytool
#      MACOS_NOTARY_TEAM_ID    – Team ID
#      MACOS_NOTARY_PASSWORD   – App-specific password for notarytool
#    Steps (add after "flutter build macos --release"):
#      1. Import cert: echo "$MACOS_CERT_P12" | base64 -d > cert.p12
#                      security create-keychain -p "" build.keychain
#                      security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
#                      security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
#      2. Sign:        codesign --deep --force --verify --verbose --sign "Developer ID Application: Your Name (TEAMID)" \
#                               --options runtime --entitlements macos/Runner/Release.entitlements \
#                               "build/macos/Build/Products/Release/CrispCloud.app"
#      3. Notarize:    xcrun notarytool submit crispcloud-macos.zip \
#                               --apple-id "$MACOS_NOTARY_APPLE_ID" \
#                               --team-id "$MACOS_NOTARY_TEAM_ID" \
#                               --password "$MACOS_NOTARY_PASSWORD" --wait
#                      xcrun stapler staple crispcloud-macos.zip
#
#  Windows (Authenticode / signtool):
#    Required secrets:
#      WIN_CERT_PFX         – base64-encoded code signing certificate (.pfx)
#      WIN_CERT_PASSWORD    – password for the .pfx
#    Steps (add after "flutter build windows --release", PowerShell):
#      1. Import cert:  [System.IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($Env:WIN_CERT_PFX))
#      2. Sign:         & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
#                              /f cert.pfx /p $Env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com `
#                              /td sha256 /fd sha256 `
#                              "build\windows\x64\runner\Release\crispcloud.exe"
#
#  Android (keystore signing):
#    Required secrets:
#      ANDROID_KEYSTORE_BASE64  – base64-encoded .jks / .keystore
#      ANDROID_KEY_ALIAS        – key alias
#      ANDROID_KEY_PASSWORD     – key password
#      ANDROID_STORE_PASSWORD   – keystore password
#    Steps (add before "flutter build apk --release"):
#      1. Decode:    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
#      2. Configure: cat >> android/key.properties <<EOF
#                    storePassword=$ANDROID_STORE_PASSWORD
#                    keyPassword=$ANDROID_KEY_PASSWORD
#                    keyAlias=$ANDROID_KEY_ALIAS
#                    storeFile=keystore.jks
#                    EOF
#      3. Ensure android/app/build.gradle reads key.properties (standard Flutter setup).
#
#  iOS (ExportOptions.plist):
#    Required secrets:
#      IOS_CERT_P12        – base64-encoded distribution certificate (.p12)
#      IOS_CERT_PASSWORD   – password for the .p12
#      IOS_PROFILE_BASE64  – base64-encoded provisioning profile (.mobileprovision)
#      IOS_EXPORT_PLIST    – contents of ExportOptions.plist (base64)
#    Steps (add after "flutter build ios --release --no-codesign"):
#      1. Import cert & profile (same pattern as macOS above).
#      2. xcodebuild -workspace ios/Runner.xcworkspace \
#                    -scheme Runner -configuration Release \
#                    -archivePath build/ios/Runner.xcarchive archive
#         xcodebuild -exportArchive \
#                    -archivePath build/ios/Runner.xcarchive \
#                    -exportOptionsPlist ExportOptions.plist \
#                    -exportPath build/ios/export/
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0). Leave empty to use pubspec version.'
        required: false
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: true

permissions:
  contents: write  # for creating GitHub releases

env:
  FLUTTER_CHANNEL: stable
  # Match the tested Flutter toolchain in .fvmrc and ci.yml.
  FLUTTER_VERSION: 3.47.8

jobs:
  # ---------- Analyze + Test (gate) ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Test release publication safeguards
        run: python3 -m unittest discover -s tool -p test_release_publication.py -v

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Check crypto release inputs
        run: |
          python3 -m unittest discover -s tool -p test_crypto_release_evidence.py -v
          python3 tool/crypto_release_evidence.py --check

      - name: Verify CrisperBooks consumer source
        run: python3 tool/verify_ebook_sources.py

      - name: Resolve vendored analyzer dependencies
        run: |
          (cd packages/quds_office_engine && dart pub get)
          (cd packages/quds_reports && dart pub get)
          (cd packages/quds_office_editor && flutter pub get)
          (cd packages/legacy_doc_parser && dart pub get)
          (cd packages/dart_pdf_editor && flutter pub get)
          (cd packages/dart_pdf_editor_secure_storage && flutter pub get)
          (cd packages/pdf_document && dart pub get)
          (cd packages/pdf_operations && dart pub get)

      - name: Install trusted distro SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev liblz4-1

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - run: >-
          python3 tool/with_ci_system_sqlite.py flutter test --concurrency=4
          --exclude-tags=benchmark,live,deploy,mock_server,integration,connection_dialog,golden

  # ---------- Prepare private draft; publish after all binary uploads ----------
  create-release:
    name: Prepare Release Draft
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag and release flags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="v$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)"
            IS_PRERELEASE="true"
          fi
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1 || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null | head -50 || true
            echo ""
            echo ""
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > changelog.md

      - name: Prepare GitHub Release draft without deleting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.is_prerelease }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          python3 tool/release_publication.py prepare "$TAG" \
            --title "CrispCloud $TAG" --notes-file changelog.md \
            --prerelease "$IS_PRERELEASE"

  # ---------- Web ----------
  build-web:
    name: Build Web
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get
      - run: flutter build web --release --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"

      - name: Package
        run: tar czf crispcloud-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-web
          path: crispcloud-web.tar.gz

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-web.tar.gz --clobber

  # ---------- Linux ----------
  build-linux:
    name: Build Linux
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"

      - name: Package
        run: tar czf crispcloud-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-linux-x64
          path: crispcloud-linux-x64.tar.gz

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-linux-x64.tar.gz --clobber

  # ---------- macOS ----------
  build-macos:
    name: Build macOS
    needs: [test, create-release]
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"

      # ── macOS Code Signing Placeholder ──────────────────────────────────
      # Uncomment and configure the steps below to enable Developer ID signing.
      # See the top-level comment block for full instructions.
      #
      # - name: Import Developer ID certificate
      #   env:
      #     MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      #     MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      #   run: |
      #     echo "$MACOS_CERT_P12" | base64 -d > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
      #       -T /usr/bin/codesign -T /usr/bin/security
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #
      # - name: Codesign .app
      #   run: |
      #     codesign --deep --force --verify --verbose \
      #       --sign "Developer ID Application: Your Name (YOURTEAMID)" \
      #       --options runtime \
      #       --entitlements macos/Runner/Release.entitlements \
      #       "build/macos/Build/Products/Release/CrispCloud.app"
      # ────────────────────────────────────────────────────────────────────

      - name: Package macOS build (.zip + .dmg)
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
          echo "Packaging: $APP_NAME"
          zip -r -y "$GITHUB_WORKSPACE/crispcloud-macos.zip" "$APP_NAME"
          # Create .dmg with drag-to-Applications layout
          mkdir -p dmg_contents
          cp -R "$APP_NAME" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "CrispCloud" -srcfolder dmg_contents \
            -ov -format UDZO "$GITHUB_WORKSPACE/crispcloud-macos.dmg"

      # ── macOS Notarization Placeholder ───────────────────────────────────
      # - name: Notarize and staple
      #   env:
      #     MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      #     MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      #     MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      #   run: |
      #     xcrun notarytool submit crispcloud-macos.zip \
      #       --apple-id "$MACOS_NOTARY_APPLE_ID" \
      #       --team-id "$MACOS_NOTARY_TEAM_ID" \
      #       --password "$MACOS_NOTARY_PASSWORD" --wait
      #     xcrun stapler staple crispcloud-macos.zip
      # ────────────────────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-macos
          path: |
            crispcloud-macos.zip
            crispcloud-macos.dmg

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-macos.zip crispcloud-macos.dmg --clobber

  # ---------- Windows ----------
  build-windows:
    name: Build Windows
    needs: [test, create-release]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            C:\hostedtoolcache\windows\flutter
            ~\AppData\Local\Pub\Cache
          key: flutter-${{ env.FLUTTER_VERSION }}-windows-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-windows-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Patch pdfx CMake (fix VERSION 2.8.12 rejected by CMake 3.30+)
        shell: bash
        run: |
          for base in . "$PUB_CACHE" "$LOCALAPPDATA/Pub/Cache" "$HOME/.pub-cache"; do
            [ -d "$base" ] || continue
            TEMPLATE=$(find "$base" -path "*/pdfx*/DownloadProject.CMakeLists.cmake.in" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.14)/' "$TEMPLATE"
              echo "Patched: $TEMPLATE"
              break
            fi
          done

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      # ── Windows Code Signing Placeholder ────────────────────────────────
      # Uncomment and configure to sign with Authenticode / signtool.
      # See the top-level comment block for full instructions.
      #
      # - name: Sign Windows executable
      #   shell: pwsh
      #   env:
      #     WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
      #     WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      #   run: |
      #     $certBytes = [Convert]::FromBase64String($Env:WIN_CERT_PFX)
      #     [System.IO.File]::WriteAllBytes("cert.pfx", $certBytes)
      #     & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
      #       /f cert.pfx /p $Env:WIN_CERT_PASSWORD `
      #       /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
      #       "build\windows\x64\runner\Release\crispcloud.exe"
      #     Remove-Item cert.pfx
      # ────────────────────────────────────────────────────────────────────

      - name: Verify native Windows file-drag receiver format
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --target crisp_file_drag_data_test
          if ($LASTEXITCODE -ne 0) { throw "Native drag protocol test did not build" }
          & ./build/windows/x64/native-tests/Release/crisp_file_drag_data_test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native drag protocol test failed" }

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-windows-x64
          path: crispcloud-windows-x64.zip

      - name: Upload to Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-windows-x64.zip --clobber

  # ---------- Android APK ----------
  build-android:
    name: Build Android APK
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          android: 'true'

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # Sign the GitHub-release APK with the same upload key the Google Play
      # and Firebase workflows use (secrets set 2026-08-21). Without
      # key.properties, build.gradle.kts falls back to the debug config, and
      # each runner makes a throwaway debug key, so no release APK could
      # install as an update over the previous one (CrisperWeaver #36 found
      # the same defect). Same layout as google-play-bundle.yml: build.gradle
      # resolves storeFile with rootProject.file(), i.e. relative to android/
      # (the old commented-out template put the .jks in android/app/, which
      # rootProject.file() would never have found).
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?ANDROID_KEYSTORE_BASE64 is required - refusing a debug-signed release}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${STORE_PASSWORD:?ANDROID_STORE_PASSWORD is required}"
          echo "$KEYSTORE_B64" | base64 --decode > android/play-upload.jks
          chmod 600 android/play-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=play-upload.jks
          EOF

      - run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: |
          # flutter build apk reports "failed to produce" when the APK path
          # doesn't match its expectation, but Gradle does build it successfully.
          # We allow the exit code and verify the APK exists ourselves.
          flutter build apk --release --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)" || true
          echo "=== Searching for APKs ==="
          find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null

      - name: Find and rename APK
        run: |
          APK=$(find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No app-release.apk found — build genuinely failed"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "Found APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::APK too small ($SIZE bytes) — likely incomplete"
            exit 1
          fi
          cp "$APK" crispcloud-android.apk

      # Never ship a debug-signed APK again: reject the "CN=Android Debug"
      # certificate and publish the real one's SHA-256 beside the APK.
      - name: Verify the APK is release-signed
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            sdkmanager --install "build-tools;35.0.0" >/dev/null
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs crispcloud-android.apk | tee signing.txt
          if grep -q "CN=Android Debug" signing.txt; then
            echo "::error::APK is debug-signed - the release keystore was not used"
            exit 1
          fi
          sed -n 's/.*certificate SHA-256 digest: //p' signing.txt | head -1 > crispcloud-android-signing-cert.sha256.txt
          rm -f android/play-upload.jks android/key.properties

      - name: Record the APK's crypto release evidence
        run: |
          set -euo pipefail
          mkdir -p build/export-compliance
          dart pub deps --json > build/export-compliance/dependencies.json
          python3 tool/crypto_release_evidence.py --platform android --require-clean --record-generated-metadata \
            --artifact crispcloud-android.apk --dependencies build/export-compliance/dependencies.json

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-android
          path: |
            crispcloud-android.apk
            build/export-compliance/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.create-release.outputs.tag }}"
          crispcloud-android.apk crispcloud-android-signing-cert.sha256.txt
          build/export-compliance/crypto-evidence.json --clobber

  # ---------- iOS (unsigned .app for later signing/export) ----------
  build-ios:
    name: Build iOS
    needs: [test, create-release]
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      # Signed App Store/TestFlight uploads are owned by ios-release.yml.
      # Keeping them out of the multi-platform release prevents two workflows
      # from uploading the same CFBundleVersion concurrently.
      HAS_APPSTORE_KEY: 'false'
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.3 on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Set up bundled ebook converter
        uses: ./.github/actions/setup-ebook-rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_VERSION }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_VERSION }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Build iOS (migrate plugins, no codesign)
        run: flutter build ios --release --no-codesign --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)"

      # ── API-key-driven archive + export + upload ────────────────────────
      - name: Install signing credentials
        if: env.HAS_APPSTORE_KEY == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          # API key for provisioning profile resolution
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8

          # Import Distribution cert + private key into a build keychain
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          if [ -n "$DIST_P12" ]; then
            echo "$DIST_P12" | base64 -d > /tmp/dist.p12
            security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm /tmp/dist.p12
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Verify Distribution identity is available
          security find-identity -v -p codesigning | grep -i "distribution" || echo "WARNING: No Distribution cert"

      - name: Archive (flutter build ipa)
        if: env.HAS_APPSTORE_KEY == 'true'
        run: |
          # Use flutter build ipa to archive — it sets the correct framework
          # search paths that raw xcodebuild misses in SPM/CocoaPods hybrid.
          # This will FAIL at its own export step (no API key) — that's expected.
          # The .xcarchive it produces is good.
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>N9XSJ4M3GT</string>
              <key>signingStyle</key><string>automatic</string>
              <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          PATH="/usr/bin:$PATH" flutter build ipa --release \
            --dart-define=APP_VERSION="${{ needs.create-release.outputs.app_version }}" --dart-define=GIT_HASH="$(git rev-parse --short HEAD)" \
            --export-options-plist=/tmp/ExportOptions.plist || true
          # Verify the archive was created
          ls -la build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/ > /dev/null

      - name: Export IPA (distribution signing)
        if: env.HAS_APPSTORE_KEY == 'true'
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8"
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8 \
            -authenticationKeyID 9RMU3C7422 \
            -authenticationKeyIssuerID 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

      - name: Validate IPA
        if: env.HAS_APPSTORE_KEY == 'true'
        run: |
          xcrun altool --validate-app \
            -f build/ios/export/Runner.ipa \
            --type ios \
            --api-key 9RMU3C7422 \
            --api-issuer 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

      - name: Upload to App Store Connect
        if: env.HAS_APPSTORE_KEY == 'true'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | cut -d'+' -f2)
          xcrun altool --upload-package build/ios/export/Runner.ipa \
            --type ios \
            --apple-id 6789570314 \
            --bundle-id com.CrispStrobe.cloud \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VERSION" \
            --api-key 9RMU3C7422 \
            --api-issuer 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

      # ── Fallback: unsigned .app zip if no API key ───────────────────────
      - name: Archive unsigned .app
        if: env.HAS_APPSTORE_KEY != 'true'
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-ios-nosign.zip "$APP_PATH"
          else
            zip -r -y crispcloud-ios-nosign.zip build/ios/iphoneos/
          fi

      - uses: actions/upload-artifact@v5
        if: env.HAS_APPSTORE_KEY != 'true'
        with:
          name: crispcloud-ios-nosign
          path: crispcloud-ios-nosign.zip

      - name: Upload to Release
        if: env.HAS_APPSTORE_KEY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-ios-nosign.zip --clobber

  build-cli:
    name: Standalone CLI bundles
    needs: [test, create-release]
    uses: ./.github/workflows/catalog-cli.yml
    with:
      release_tag: ${{ needs.create-release.outputs.tag }}
    secrets: inherit

  publish-release:
    name: Publish complete release
    needs: [create-release, build-web, build-linux, build-macos, build-windows, build-android, build-ios, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify all platform binaries and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: python3 tool/release_publication.py publish "$RELEASE_TAG"
