name: Release

# Builds release artifacts for all platforms and creates a GitHub Release.
#
# Triggered by:
#   - Pushing a tag like v0.1.0 → creates a full stable release
#   - Manual dispatch (workflow_dispatch) → creates a GitHub pre-release
#
# Artifacts:
#   - Web:     .tar.gz of build/web
#   - macOS:   .zip of .app bundle  (code-sign placeholder — see below)
#   - Linux:   .tar.gz of bundle
#   - Windows: .zip of release bundle  (code-sign placeholder — see below)
#   - Android: APK  (keystore-sign placeholder — see below)
#   - iOS:     .zip of unsigned .app  (export placeholder — see below)
#
# ─── CODE SIGNING — HOW TO ENABLE ────────────────────────────────────────────
#
#  macOS (Developer ID):
#    Required secrets:
#      MACOS_CERT_P12          – base64-encoded Developer ID certificate (.p12)
#      MACOS_CERT_PASSWORD     – password for the .p12
#      MACOS_NOTARY_APPLE_ID   – Apple ID for notarytool
#      MACOS_NOTARY_TEAM_ID    – Team ID
#      MACOS_NOTARY_PASSWORD   – App-specific password for notarytool
#    Steps (add after "flutter build macos --release"):
#      1. Import cert: echo "$MACOS_CERT_P12" | base64 -d > cert.p12
#                      security create-keychain -p "" build.keychain
#                      security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
#                      security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
#      2. Sign:        codesign --deep --force --verify --verbose --sign "Developer ID Application: Your Name (TEAMID)" \
#                               --options runtime --entitlements macos/Runner/Release.entitlements \
#                               "build/macos/Build/Products/Release/CrispCloud.app"
#      3. Notarize:    xcrun notarytool submit crispcloud-macos.zip \
#                               --apple-id "$MACOS_NOTARY_APPLE_ID" \
#                               --team-id "$MACOS_NOTARY_TEAM_ID" \
#                               --password "$MACOS_NOTARY_PASSWORD" --wait
#                      xcrun stapler staple crispcloud-macos.zip
#
#  Windows (Authenticode / signtool):
#    Required secrets:
#      WIN_CERT_PFX         – base64-encoded code signing certificate (.pfx)
#      WIN_CERT_PASSWORD    – password for the .pfx
#    Steps (add after "flutter build windows --release", PowerShell):
#      1. Import cert:  [System.IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($Env:WIN_CERT_PFX))
#      2. Sign:         & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
#                              /f cert.pfx /p $Env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com `
#                              /td sha256 /fd sha256 `
#                              "build\windows\x64\runner\Release\crispcloud.exe"
#
#  Android (keystore signing):
#    Required secrets:
#      ANDROID_KEYSTORE_BASE64  – base64-encoded .jks / .keystore
#      ANDROID_KEY_ALIAS        – key alias
#      ANDROID_KEY_PASSWORD     – key password
#      ANDROID_STORE_PASSWORD   – keystore password
#    Steps (add before "flutter build apk --release"):
#      1. Decode:    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
#      2. Configure: cat >> android/key.properties <<EOF
#                    storePassword=$ANDROID_STORE_PASSWORD
#                    keyPassword=$ANDROID_KEY_PASSWORD
#                    keyAlias=$ANDROID_KEY_ALIAS
#                    storeFile=keystore.jks
#                    EOF
#      3. Ensure android/app/build.gradle reads key.properties (standard Flutter setup).
#
#  iOS (ExportOptions.plist):
#    Required secrets:
#      IOS_CERT_P12        – base64-encoded distribution certificate (.p12)
#      IOS_CERT_PASSWORD   – password for the .p12
#      IOS_PROFILE_BASE64  – base64-encoded provisioning profile (.mobileprovision)
#      IOS_EXPORT_PLIST    – contents of ExportOptions.plist (base64)
#    Steps (add after "flutter build ios --release --no-codesign"):
#      1. Import cert & profile (same pattern as macOS above).
#      2. xcodebuild -workspace ios/Runner.xcworkspace \
#                    -scheme Runner -configuration Release \
#                    -archivePath build/ios/Runner.xcarchive archive
#         xcodebuild -exportArchive \
#                    -archivePath build/ios/Runner.xcarchive \
#                    -exportOptionsPlist ExportOptions.plist \
#                    -exportPath build/ios/export/
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0). Leave empty to use pubspec version.'
        required: false
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: true

permissions:
  contents: write  # for creating GitHub releases

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------- Analyze + Test (gate) ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-warnings 2>&1 | grep -v "cli/" | tee analyze.log || true
          if grep -q "  error • " analyze.log; then exit 1; fi

      - run: flutter test --exclude-tags=mock_server,integration,connection_dialog

  # ---------- Create Release (empty, assets added by each build) ----------
  create-release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine tag and release flags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="v$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '+')"
            IS_PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | head -2 | tail -1 || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null | head -50 || true
            echo ""
            echo ""
            echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > changelog.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.is_prerelease }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$TAG" \
            --title "CrispCloud $TAG" \
            --notes-file changelog.md \
            $PRERELEASE_FLAG

  # ---------- Web ----------
  build-web:
    name: Build Web
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get
      - run: flutter build web --release

      - name: Package
        run: tar czf crispcloud-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-web
          path: crispcloud-web.tar.gz

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-web.tar.gz --clobber

  # ---------- Linux ----------
  build-linux:
    name: Build Linux
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            libjsoncpp-dev libsecret-1-0 libsqlite3-dev libayatana-appindicator3-dev

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: tar czf crispcloud-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-linux-x64
          path: crispcloud-linux-x64.tar.gz

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-linux-x64.tar.gz --clobber

  # ---------- macOS ----------
  build-macos:
    name: Build macOS
    needs: [test, create-release]
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true  # macOS runners scarce on free tier
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release

      # ── macOS Code Signing Placeholder ──────────────────────────────────
      # Uncomment and configure the steps below to enable Developer ID signing.
      # See the top-level comment block for full instructions.
      #
      # - name: Import Developer ID certificate
      #   env:
      #     MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      #     MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      #   run: |
      #     echo "$MACOS_CERT_P12" | base64 -d > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
      #       -T /usr/bin/codesign -T /usr/bin/security
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #
      # - name: Codesign .app
      #   run: |
      #     codesign --deep --force --verify --verbose \
      #       --sign "Developer ID Application: Your Name (YOURTEAMID)" \
      #       --options runtime \
      #       --entitlements macos/Runner/Release.entitlements \
      #       "build/macos/Build/Products/Release/CrispCloud.app"
      # ────────────────────────────────────────────────────────────────────

      - name: Package macOS build (.zip + .dmg)
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app 2>/dev/null | head -1)
          echo "Packaging: $APP_NAME"
          zip -r -y "$GITHUB_WORKSPACE/crispcloud-macos.zip" "$APP_NAME"
          # Create .dmg with drag-to-Applications layout
          mkdir -p dmg_contents
          cp -R "$APP_NAME" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "CrispCloud" -srcfolder dmg_contents \
            -ov -format UDZO "$GITHUB_WORKSPACE/crispcloud-macos.dmg"

      # ── macOS Notarization Placeholder ───────────────────────────────────
      # - name: Notarize and staple
      #   env:
      #     MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      #     MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      #     MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      #   run: |
      #     xcrun notarytool submit crispcloud-macos.zip \
      #       --apple-id "$MACOS_NOTARY_APPLE_ID" \
      #       --team-id "$MACOS_NOTARY_TEAM_ID" \
      #       --password "$MACOS_NOTARY_PASSWORD" --wait
      #     xcrun stapler staple crispcloud-macos.zip
      # ────────────────────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-macos
          path: |
            crispcloud-macos.zip
            crispcloud-macos.dmg

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-macos.zip crispcloud-macos.dmg --clobber

  # ---------- Windows ----------
  build-windows:
    name: Build Windows
    needs: [test, create-release]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            C:\hostedtoolcache\windows\flutter
            ~\AppData\Local\Pub\Cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-windows-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-windows-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        shell: bash
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      - name: Patch pdfx CMake (fix VERSION 2.8.12 rejected by CMake 3.30+)
        shell: bash
        run: |
          for base in . "$PUB_CACHE" "$LOCALAPPDATA/Pub/Cache" "$HOME/.pub-cache"; do
            [ -d "$base" ] || continue
            TEMPLATE=$(find "$base" -path "*/pdfx*/DownloadProject.CMakeLists.cmake.in" 2>/dev/null | head -1)
            if [ -n "$TEMPLATE" ]; then
              sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.14)/' "$TEMPLATE"
              echo "Patched: $TEMPLATE"
              break
            fi
          done

      - name: Build Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      # ── Windows Code Signing Placeholder ────────────────────────────────
      # Uncomment and configure to sign with Authenticode / signtool.
      # See the top-level comment block for full instructions.
      #
      # - name: Sign Windows executable
      #   shell: pwsh
      #   env:
      #     WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
      #     WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      #   run: |
      #     $certBytes = [Convert]::FromBase64String($Env:WIN_CERT_PFX)
      #     [System.IO.File]::WriteAllBytes("cert.pfx", $certBytes)
      #     & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign `
      #       /f cert.pfx /p $Env:WIN_CERT_PASSWORD `
      #       /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
      #       "build\windows\x64\runner\Release\crispcloud.exe"
      #     Remove-Item cert.pfx
      # ────────────────────────────────────────────────────────────────────

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath crispcloud-windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-windows-x64
          path: crispcloud-windows-x64.zip

      - name: Upload to Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-windows-x64.zip --clobber

  # ---------- Android APK ----------
  build-android:
    name: Build Android APK
    needs: [test, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # ── Android Keystore Signing Placeholder ────────────────────────────
      # Uncomment and configure to sign with a production keystore.
      # See the top-level comment block for full instructions.
      #
      # - name: Decode and configure keystore
      #   env:
      #     ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      #     ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #     ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      #   run: |
      #     echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
      #     cat > android/key.properties <<EOF
      #     storePassword=$ANDROID_STORE_PASSWORD
      #     keyPassword=$ANDROID_KEY_PASSWORD
      #     keyAlias=$ANDROID_KEY_ALIAS
      #     storeFile=keystore.jks
      #     EOF
      # ────────────────────────────────────────────────────────────────────

      - run: flutter pub get

      - name: Build APK
        run: |
          # flutter build apk reports "failed to produce" when the APK path
          # doesn't match its expectation, but Gradle does build it successfully.
          # We allow the exit code and verify the APK exists ourselves.
          flutter build apk --release || true
          echo "=== Searching for APKs ==="
          find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null

      - name: Find and rename APK
        run: |
          APK=$(find . -name "app-release.apk" -not -path "*/intermediates/*" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No app-release.apk found — build genuinely failed"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "Found APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::APK too small ($SIZE bytes) — likely incomplete"
            exit 1
          fi
          cp "$APK" crispcloud-android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-android
          path: crispcloud-android.apk

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-android.apk --clobber

  # ---------- iOS (unsigned .app for later signing/export) ----------
  build-ios:
    name: Build iOS (no-codesign)
    needs: [test, create-release]
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true  # macOS runners scarce on free tier
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter SDK + pub
        uses: actions/cache@v5
        with:
          path: |
            ~/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ env.FLUTTER_CHANNEL }}-macos-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-macos-

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Git auth
        run: |
          TOKEN="${{ secrets.GH_PAT || github.token }}"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: flutter pub get

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      # ── iOS Export Placeholder ───────────────────────────────────────────
      # Uncomment to sign + export IPA for TestFlight / App Store.
      # See the top-level comment block for full instructions.
      #
      # - name: Import distribution certificate
      #   env:
      #     IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
      #     IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      #     IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      #   run: |
      #     echo "$IOS_CERT_P12" | base64 -d > cert.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" \
      #       -T /usr/bin/codesign -T /usr/bin/security
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo "$IOS_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/dist.mobileprovision
      #
      # - name: Archive and export IPA
      #   env:
      #     IOS_EXPORT_PLIST: ${{ secrets.IOS_EXPORT_PLIST }}
      #   run: |
      #     echo "$IOS_EXPORT_PLIST" | base64 -d > ExportOptions.plist
      #     xcodebuild -workspace ios/Runner.xcworkspace \
