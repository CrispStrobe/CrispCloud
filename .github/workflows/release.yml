      - name: Archive unsigned .app
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 1 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            zip -r -y crispcloud-ios-nosign.zip "$APP_PATH"
          else
            zip -r -y crispcloud-ios-nosign.zip build/ios/iphoneos/
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: crispcloud-ios-nosign
          path: crispcloud-ios-nosign.zip

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" crispcloud-ios-nosign.zip --clobber
