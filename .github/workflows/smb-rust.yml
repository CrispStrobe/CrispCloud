name: Experimental Rust SMB
on:
  push:
    paths: ['packages/crisp_storage/**', 'cli/**', 'lib/**smb**', 'lib/widgets/connection_dialog.dart', 'test/**smb**', '.github/workflows/smb-rust.yml']
  pull_request:
    paths: ['packages/crisp_storage/**', 'cli/**', 'lib/**smb**', 'lib/widgets/connection_dialog.dart', 'test/**smb**', '.github/workflows/smb-rust.yml']
  workflow_dispatch:
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/crisp_storage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - run: cargo test --manifest-path native/crisp_smb/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked
      - run: dart pub get
      - run: dart analyze
      - if: runner.os != 'macOS'
        run: dart test
      - name: Run macOS package tests with a short native-asset path
        if: runner.os == 'macOS'
        run: python3 tool/run_package_tests.py
      - if: runner.os == 'Linux'
        run: |
          python3 -m venv .fixture-venv
          .fixture-venv/bin/pip install impacket==0.13.0
          CRISPER_SMB_PYTHON="$PWD/.fixture-venv/bin/python" CRISP_SMB_LIBRARY="$PWD/rust/target/release/libcrisp_smb_bridge.so" dart test test/rust_smb_test.dart test/smb_transfer_test.dart
          python3 tool/check_rust_licenses.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-smb-${{ matrix.os }}
          path: |
            packages/crisp_storage/rust/target/release/*crisp_smb_bridge.so
            packages/crisp_storage/rust/target/release/*crisp_smb_bridge.dylib
            packages/crisp_storage/rust/target/release/*crisp_smb_bridge.dll
            packages/crisp_storage/licensing/
          if-no-files-found: error
  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: |
          cargo build --manifest-path packages/crisp_storage/rust/Cargo.toml --locked --release --target aarch64-apple-ios
          cargo build --manifest-path packages/crisp_storage/rust/Cargo.toml --locked --release --target aarch64-apple-ios-sim
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-smb-ios-static
          path: packages/crisp_storage/rust/target/aarch64-apple-*/release/libcrisp_smb_bridge.a
          if-no-files-found: error
  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true
      - run: cargo build --manifest-path packages/crisp_storage/rust/Cargo.toml --locked
      - run: |
          python3 -m venv .smb-venv
          .smb-venv/bin/pip install impacket==0.13.0
          echo "CRISPER_SMB_PYTHON=$PWD/.smb-venv/bin/python" >> "$GITHUB_ENV"
          echo "CRISP_SMB_LIBRARY=$PWD/packages/crisp_storage/rust/target/debug/libcrisp_smb_bridge.so" >> "$GITHUB_ENV"
      - name: Authenticate private source dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - run: flutter test test/smb_backend_field_test.dart test/smb_client_adapter_test.dart test/smb_connection_profile_dialog_test.dart
      - working-directory: cli
        run: |
          dart pub get
          dart analyze
          dart test test/smb_adapter_test.dart test/cli_runner_test.dart
