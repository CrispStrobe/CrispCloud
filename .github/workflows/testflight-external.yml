name: Submit External TestFlight Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Uploaded macOS CFBundleVersion'
        required: true
        type: string
      group:
        description: 'Exact external group name (leave blank when only one exists)'
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"

      - name: Wait for processing and submit to external TestFlight review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc-key.p8
          ASC_BUNDLE_ID: com.CrispStrobe.cloud
          ASC_PLATFORM: MAC_OS
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
          TESTFLIGHT_GROUP: ${{ inputs.group }}
          TESTFLIGHT_WHAT_TO_TEST: >-
            Please verify launch reliability, sign-in, cloud browsing,
            uploads/downloads, previews, and Finder integration on macOS.
        run: ruby tool/testflight_external.rb
