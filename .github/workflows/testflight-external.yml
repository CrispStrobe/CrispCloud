name: Submit External TestFlight Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Uploaded CFBundleVersion'
        required: true
        type: string
      platform:
        description: 'Platform of the uploaded build'
        required: true
        type: choice
        default: MAC_OS
        options:
          - MAC_OS
          - IOS
      build_id:
        description: 'Exact App Store Connect build ID (required when the number matches multiple builds)'
        required: false
        type: string
      group_id:
        description: 'Reviewed external group ID (optional only when policy lists exactly one ID)'
        required: false
        type: string
      group:
        description: 'Optional name cross-check for the reviewed external group ID'
        required: false
        type: string

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$P8_B64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"

      - name: Wait for processing and submit to external TestFlight review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc-key.p8
          ASC_BUNDLE_ID: com.CrispStrobe.cloud
          ASC_PLATFORM: ${{ inputs.platform }}
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_BUILD_ID: ${{ inputs.build_id }}
          TESTFLIGHT_GROUP_ID: ${{ inputs.group_id }}
          TESTFLIGHT_GROUP: ${{ inputs.group }}
          TESTFLIGHT_WHAT_TO_TEST: >-
            Please verify launch reliability, sign-in, cloud browsing,
            uploads/downloads, previews, text editing, audio editing, ebook
            reading and conversion, and platform file-provider integration.
        run: ruby tool/testflight_external.rb
