include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - cli/**
    # Third-party source vendored for a macOS sandbox patch. It keeps its own
    # upstream style; app analysis should not report that package's lint debt.
    - packages/filen_client/**
    # Vendored Quds packages keep their upstream tests and dev-only imports.
    # Those suites run in the quds_office_suite fork, not in the app analysis.
    - packages/quds_office_engine/test/**
    - packages/quds_office_editor/test/**
    # Vendored PDF packages have their own workflows and package-local tests.
    - packages/dart_pdf_editor/test/**
    - packages/dart_pdf_editor_secure_storage/test/**
    # PDF operations/document packages have their own package-local test setup.
    - packages/pdf_document/test/**
    - packages/pdf_operations/test/**
    - packages/pdf_operations/tool/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    missing_return: error
    dead_code: warning

linter:
  rules:
    avoid_print: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_this: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    always_declare_return_types: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
