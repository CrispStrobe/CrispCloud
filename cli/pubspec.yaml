name: crisp
description: CrispCloud CLI companion — manage cloud storage from the terminal.
publish_to: 'none'
version: 1.3.1

executables:
  crispcloud:
  crisp:

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  crisp_catalog:
    path: ../packages/crisp_catalog
  pdf_operations:
    path: ../packages/pdf_operations
  args: ^2.4.2
  collection: ^1.19.1
  yaml: ^3.1.0
  xml: '>=6.5.0 <8.0.0'
  http: ^1.2.0
  crypto: ^3.0.3
  path: ^1.9.1
  dartssh2: ^4.1.0
  crisp_storage:
    path: ../packages/crisp_storage

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0

dependency_overrides:
  pointycastle: ^4.0.0
  pdf_document:
    path: ../packages/pdf_document
