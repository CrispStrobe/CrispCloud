name: crisp_ebook_conversion
flutter:
  assets:
    - licensing/THIRD_PARTY_LICENSES.txt
    - assets/
description: Offline Kindle export and metadata updates using pinned MIT Kindling.
version: 0.1.0
publish_to: none
repository: https://github.com/CrispStrobe/crisperbooks
issue_tracker: https://github.com/CrispStrobe/crisperbooks/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  code_assets: ^2.2.0
  hooks: ^2.2.0
  ffi: ^2.2.0
  path: ^1.9.1
  web: ^1.1.2

dev_dependencies:
  crisp_ebook:
    path: ../crisp_ebook
  crypto: ^3.0.3
  test: ^1.25.0
  lints: ^5.0.0

