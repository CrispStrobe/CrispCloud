name: crisp_ebook_reader
description: Offline, host-controlled ebook reading and normalized import for Flutter and Dart applications.
version: 0.1.0
publish_to: none
repository: https://github.com/CrispStrobe/crisperbooks
issue_tracker: https://github.com/CrispStrobe/crisperbooks/issues
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  web: ^1.1.1
dev_dependencies:
  crisp_ebook:
    path: ../crisp_ebook
  crisp_ebook_conversion:
    path: ../crisp_ebook_conversion
  archive: ^4.6.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: CrispEbookReaderPlugin
  assets:
    - assets/
    - assets/foliate/
    - assets/foliate/vendor/
    - assets/licenses/
