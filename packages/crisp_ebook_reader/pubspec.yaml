name: crisp_ebook_reader
description: Offline, host-controlled ebook reading and normalized import for CrispCloud.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  assets:
    - assets/
    - assets/foliate/
    - assets/foliate/vendor/
    - assets/licenses/
