name: crisp_ios_shell
description: Stream-connected, embedded ios_system and Dash shell for CrispCloud.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'
dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CrispIosShellPlugin
