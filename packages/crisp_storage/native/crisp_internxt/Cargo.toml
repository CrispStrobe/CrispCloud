[package]
name = "crisp-internxt"
version = "0.1.0"
edition = "2021"
description = "Unofficial Internxt Cloud Drive client library and CLI"
license = "MPL-2.0"
repository = "https://github.com/CrispStrobe/crisp-cloud-rs"
readme = "README.md"
keywords = ["internxt", "cloud-storage", "e2ee", "multipart", "resumable-upload"]
categories = ["api-bindings", "filesystem", "command-line-utilities"]

[lib]
name = "crisp_internxt"
path = "src/lib.rs"

[[bin]]
name = "crisp-internxt"
path = "src/main.rs"
required-features = ["cli"]

# CrispCloud vendoring patch: the test CLI is optional so the app bridge does
# not resolve clap. Build it with `--features cli`.
[features]
cli = ["dep:clap"]

[dependencies]
aes = "0.8"
anyhow = "1.0.102"
cbc = "0.1"
clap = { version = "4.6", features = ["derive"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
filetime = "0.2"
cipher = "0.4"
ctr = "0.9"
getrandom = "0.2"
hex = "0.4"
md-5 = "0.10"
pbkdf2 = "0.12"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "blocking", "rustls"] }
ripemd = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"

# CrispCloud vendoring patch: CrispSorter's test-only internxt-core oracle is
# not vendored. Its conformance test is compiled only with
# RUSTFLAGS="--cfg crisp_internxt_core_reference" inside CrispSorter.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(crisp_internxt_core_reference)"] }

[workspace]
