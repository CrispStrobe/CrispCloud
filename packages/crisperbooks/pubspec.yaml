name: crisperbooks
description: Offline EPUB editing, ebook reading, portable reading data and reusable Flutter controls.
version: 0.1.0
publish_to: none
repository: https://github.com/CrispStrobe/crisperbooks
issue_tracker: https://github.com/CrispStrobe/crisperbooks/issues
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  crisp_ebook:
    path: ../crisp_ebook
  crisp_ebook_reader:
    path: ../crisp_ebook_reader
  archive: ^4.6.0
  crypto: ^3.0.3
  html: ^0.15.6
  flutter_widget_from_html_core: ^0.17.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
