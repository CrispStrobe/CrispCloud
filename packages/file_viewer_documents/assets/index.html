<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'none'; frame-src blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Document preview</title>
  <style>
    :root{font:14px system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}html,body,#document{height:100%;width:100%;margin:0;min-width:0}body{background:#f3f5f7;color:#172033}body[data-dark=true]{background:#101820;color:#e5eef8}#document{overflow:auto}button,input,textarea{font:inherit}button{min-height:36px}button:focus-visible,a:focus-visible{outline:3px solid #3c8bd9;outline-offset:2px}.document-error{padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}.xml-tools{padding:16px;max-width:1100px;margin:auto}.xml-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.xml-tools textarea{width:100%;height:160px;resize:vertical;font-family:monospace}.xml-tools pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto}.xml-tools iframe{width:100%;height:55vh;background:white;border:1px solid #bbc4cf}.xml-resource{display:grid;gap:6px;margin:12px 0}.xml-status{padding:12px;border:1px solid #7b8ca0;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}.xml-status[hidden]{display:none}
  </style>
  <script type="module" src="runtime/host.js"></script>
</head>
<body><main id="document" aria-label="Document preview"></main></body>
</html>
