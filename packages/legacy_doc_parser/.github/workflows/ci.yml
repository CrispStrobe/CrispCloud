name: Dart package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: python3 tool/fidelity/oracle.py
      - run: python3 -m unittest discover -s tool/fidelity -p 'test_*.py'
      - run: python3 tool/verify_web.py
      - run: dart pub publish --dry-run
  openxml-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dart pub get
      - run: python3 tool/fidelity/schema.py --out build/schema-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openxml-schema-receipts
          path: |
            build/schema-ci/*.json
            build/schema-ci/*.log
            build/schema-ci/corpus
            build/schema-ci/controls
