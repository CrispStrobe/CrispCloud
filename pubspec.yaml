name: crisp_cloud
description: Flutter/Dart Cloud storage client
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  provider: ^6.1.1  # kept during incremental migration
  
  # UI
  desktop_drop: ^0.7.1

  # Web specific
  universal_html: ^2.2.4
  
  # Database (sync metadata, file cache, settings)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Markdown preview
  flutter_markdown: ^0.7.6

  # PDF preview
  pdfx: ^2.6.0

  # Filesystem watching (sync engine)
  watcher: ^1.1.0

  # System tray (background sync on desktop)
  system_tray: ^2.0.3

  # Mobile background sync (Android Workmanager + iOS background fetch)
  workmanager: ^0.9.0
  flutter_local_notifications: ^17.2.4

  # File Handling
  cross_file: ^0.3.3+8
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Sharing
  share_plus: ^7.2.2
  receive_sharing_intent: ^1.5.3
  
  # Networking & Crypto
  http: ^1.2.0
  args: ^2.4.2
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  bip39: ^1.0.6
  hex: ^0.2.0
  glob: ^2.1.2
  archive: ^3.6.1
  file_picker: ^10.3.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  video_player: ^2.9.2
  file_selector: ^1.0.4
  file_selector_macos: ^0.9.4
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  macos_secure_bookmarks: ^0.2.1

  # Material You / dynamic color (Android 12+)
  dynamic_color: ^1.7.0

  # FTP/FTPS
  ftpconnect: ^2.0.5

  # SFTP
  dartssh2: ^2.10.0
  web_socket_channel: ^3.0.0 # for sockified (needed for web builds)

  # WebDAV Dependencies
  shelf: ^1.4.0
  shelf_router: ^1.1.0 # for adding other handlers
  shelf_dav: ^1.0.0    # The server
  file: ^7.0.0         # The virtual filesystem interface
  webdav_client: ^1.2.2

  # Internxt protocol — sourced from the published library instead
  # of the previous embedded copy in lib/services/internxt_client.dart
  # (Phase 6.c). Git dep so Vercel + CI can fetch it without needing
  # a sibling checkout dance. Local dev can pin to ../internxt-dart
  # via a gitignored pubspec_overrides.yaml (faster iteration
  # against in-flight library changes). Switch to a version
  # constraint once internxt_client publishes to pub.dev.
  internxt_client:
    git:
      url: https://github.com/CrispStrobe/internxt-dart.git
      ref: main

  # Filen protocol — sourced from the published library instead
  # of the previous embedded copy in lib/services/filen.dart.
  # Same pattern as internxt_client above.
  filen_dart:
    git:
      url: https://github.com/CrispStrobe/filen-dart.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

dependency_overrides:
  libdbm:
    git:
      url: https://github.com/CrispStrobe/libdbm
    # path: ../libdbm #

  # system_tray (unmaintained) pins uuid ^3.x but pdfx needs ^4.x.
  # Force uuid 4.x — system_tray only uses uuid.v4() which is unchanged.
  uuid: 4.5.1


flutter:
  generate: true
  uses-material-design: true
  
  # App Icons
  assets:
    - assets/images/app_icon.png # Add your new icon path

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  
  # Mobile Platforms (boolean 'true' is fine)
  android: true
  ios: true
  
  # Desktop Platforms (must be configured as a map to enable generation)
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true